# cargo-nextest configuration. Drives `make test` (and any bare `cargo nextest run`).
#
# Why nextest here: nextest runs every test case in its OWN process, so Brood's
# signature failure mode — an uncatchable SIGSEGV from a green-process coroutine
# stack overflow (see docs/devlog.md, the brood-debug skill) — is contained to the
# single offending case instead of aborting the whole test binary and taking every
# sibling case down with it. It also gives a true per-CASE timeout (below), which
# plain `cargo test`/libtest cannot.

[profile.default]
# Per-test-case hard cap. nextest prints a "slow" warning every `period`, and after
# `terminate-after` periods it kills the test (SIGTERM, then SIGKILL on its own grace
# timer). 60s × 2 = a heads-up at 1 min and a hard kill at 2 min — so no single test
# can exceed 2 minutes, while a hung/segfaulting case is reported and the rest of the
# run continues.
slow-timeout = { period = "60s", terminate-after = 2 }

# Real-TCP distribution tests (`crates/cli/tests/distribution.rs`) spin two real
# `brood` child processes that bind/connect over loopback. Under nextest, each test
# case runs in its OWN process, so the test file's process-global `port_lock()`
# mutex serialises NOTHING across cases — all ~20 would otherwise run at once,
# racing `free_port()` for the same just-freed port and saturating every core with
# simultaneous node pairs, which made a few flake on a ~5s connect/receive timeout
# under full-workspace load. Pin them to a single-threaded test group so nextest
# runs them one at a time — the cross-process equivalent of `port_lock` (the Unix
# tests share the group too; harmless, they're fast).
[test-groups]
real-tcp = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(distribution)'
test-group = 'real-tcp'
# One retry: these spin real TCP node pairs with ~5s connect/receive timeouts, and
# a loaded runner (CI shares 2 cores with the rest of the workspace build) can blow
# a deadline with no code at fault (`reconnect_watcher_heals_a_fallen_link`
# "TIMEOUT-no-pong", 2026-07-19 — passed untouched on rerun). A deterministic
# regression still fails both attempts and stays red; nextest marks a pass-on-retry
# as FLAKY in the summary so it stays visible rather than silently absorbed.
retries = 1

# `serve_attach` (ADR-090) likewise spins two real `brood` child processes over
# loopback (a daemon + an attaching client); same reasoning as `distribution` — pin
# it to the single-threaded group so it doesn't race for ports under full load.
[[profile.default.overrides]]
filter = 'binary(serve_attach)'
test-group = 'real-tcp'
# Same real-network timing exposure as `distribution` above — same one-retry policy.
retries = 1

# `brood_suite_passes` (tests/suite.rs) runs the ENTIRE in-language suite (~1200
# cases) inside ONE nextest case, so the 120s default cap is the wrong scale: under
# a full `make test` it competes with the rest of the workspace for cores and
# legitimately needs longer, and its own inner per-test ceiling (`*test-timeout-ms*`,
# 120s in std/test.blsp) must be able to fire *before* nextest kills the wrapper.
# Give this one binary a 600s cap (60s × 10) so the inner timeout stays the
# meaningful one; every other test keeps the 120s default above.
#
# Raised 300s → 600s on 2026-07-26: the in-language suite grew by the external
# conformance corpora (ROADMAP "External conformance corpora"), which add ~67s of
# DEBUG-build work — the UCD normalisation closure alone is ~19,000 cases × 6
# normalisations. That is real coverage, not waste, and this cap is a wall-clock budget
# for the whole suite in one process; the meaningful per-case guard is still the inner
# `*test-timeout-ms*`. If this needs raising again, first check whether a single case has
# become slow (fix that instead) rather than reflexively bumping the budget.
[[profile.default.overrides]]
filter = 'binary(suite)'
slow-timeout = { period = "60s", terminate-after = 10 }
# One retry, for the same reason `distribution`/`serve_attach` get one — and with a
# sharper edge here. The in-language suite CONTAINS timing-sensitive cases that talk
# to a local node (`tests/remote_spawn_test.blsp` does a `remote-spawn` round trip),
# and because they run inside this single wrapper case they were the only such tests
# in the workspace with no second chance: one blown deadline under a loaded runner
# reddened all ~3160 of them (observed 2026-07-25 — the same case passed 3/3
# standalone and 2/2 in full re-runs immediately after). The retry costs nothing on a
# green run (nextest only re-runs a FAILED case), a deterministic regression still
# fails both attempts and stays red, and a pass-on-retry is reported as FLAKY so it
# cannot be silently absorbed.
retries = 1
