# cargo-nextest configuration. Drives `make test` (and any bare `cargo nextest run`).
#
# Why nextest here: nextest runs every test case in its OWN process, so Brood's
# signature failure mode — an uncatchable SIGSEGV from a green-process coroutine
# stack overflow (see docs/devlog.md, the brood-debug skill) — is contained to the
# single offending case instead of aborting the whole test binary and taking every
# sibling case down with it. It also gives a true per-CASE timeout (below), which
# plain `cargo test`/libtest cannot.

# KI-38 — warm the expanded-prelude boot cache before the fan-out. Root-level
# because nextest still gates setup scripts (0.9.137); it gates only that
# feature, and a nextest too old to know the key fails loudly at parse time
# rather than silently skipping the warm-up. See `[scripts.setup...]` at the end.
experimental = ["setup-scripts"]

[profile.default]
# Per-test-case hard cap. nextest prints a "slow" warning every `period`, and after
# `terminate-after` periods it kills the test (SIGTERM, then SIGKILL on its own grace
# timer). 60s × 2 = a heads-up at 1 min and a hard kill at 2 min — so no single test
# can exceed 2 minutes, while a hung/segfaulting case is reported and the rest of the
# run continues.
slow-timeout = { period = "60s", terminate-after = 2 }

# Real-TCP distribution tests (`crates/cli/tests/distribution.rs`) spin two real
# `brood` child processes that bind/connect over loopback. Under nextest, each test
# case runs in its OWN process, so the test file's process-global `port_lock()`
# mutex serialises NOTHING across cases — all ~20 would otherwise run at once,
# racing `free_port()` for the same just-freed port and saturating every core with
# simultaneous node pairs, which made a few flake on a ~5s connect/receive timeout
# under full-workspace load. Pin them to a single-threaded test group so nextest
# runs them one at a time — the cross-process equivalent of `port_lock` (the Unix
# tests share the group too; harmless, they're fast).
[test-groups]
real-tcp = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(distribution)'
test-group = 'real-tcp'
# One retry: these spin real TCP node pairs with ~5s connect/receive timeouts, and
# a loaded runner (CI shares 2 cores with the rest of the workspace build) can blow
# a deadline with no code at fault (`reconnect_watcher_heals_a_fallen_link`
# "TIMEOUT-no-pong", 2026-07-19 — passed untouched on rerun). A deterministic
# regression still fails both attempts and stays red; nextest marks a pass-on-retry
# as FLAKY in the summary so it stays visible rather than silently absorbed.
retries = 1

# `serve_attach` (ADR-090) and `observe_attach` likewise spin two real `brood` child
# processes over loopback (a daemon + an attaching client); same reasoning as
# `distribution` — pin them to the single-threaded group so they don't race for ports
# under full load.
#
# `observe_attach` was missing from this list until 2026-07-26 even though it carries
# its own `port_lock()`/`free_port()` — i.e. exactly the pattern the `distribution`
# comment above explains serialises NOTHING once nextest gives each case its own
# process. It was the last real-TCP binary left unpinned and unretried, so it was the
# one that flaked: `remote_attach_reads_snapshot_then_sees_disconnect` failed under a
# full `make test` and passed in 7.2s standalone.
[[profile.default.overrides]]
filter = 'binary(serve_attach) | binary(observe_attach)'
test-group = 'real-tcp'
# Same real-network timing exposure as `distribution` above — same one-retry policy.
retries = 1

# `live_migration` asserts that a scheduler EVENT WAS OBSERVED, not just that results are
# right: `deep_receive_continuations_resume_correctly_across_workers` runs up to 400 bursts and
# fails unless `migrate_count() > 0` — i.e. unless a capture-mode process actually resumed on a
# *different* worker. On a runner sharing 2 cores with the workspace build, that observation can
# simply not happen while every result is correct, which is exactly how it failed on 12b31fc2
# (2026-08-28, KI-79): the per-burst correctness assertion passed 400/400 and only the
# "was a migration seen" assertion fired. The test's own message says as much.
#
# It was the last test in the suite asserting an observation of concurrency with NO retry, which
# is the same gap the `distribution` comment above describes. One retry: a starvation blip stops
# reddening CI, a real regression still fails both attempts, and a pass-on-retry is reported as
# FLAKY so it cannot be silently absorbed.
[[profile.default.overrides]]
filter = 'binary(live_migration)'
retries = 1

# `brood_suite_passes` (tests/suite.rs) runs the ENTIRE in-language suite (~1200
# cases) inside ONE nextest case, so the 120s default cap is the wrong scale: under
# a full `make test` it competes with the rest of the workspace for cores and
# legitimately needs longer, and its own inner per-test ceiling (`*test-timeout-ms*`,
# 120s in std/test.blsp) must be able to fire *before* nextest kills the wrapper.
# Give this one binary a 600s cap (60s × 10) so the inner timeout stays the
# meaningful one; every other test keeps the 120s default above.
#
# Raised 300s → 600s on 2026-07-26: the in-language suite grew by the external
# conformance corpora (ROADMAP "External conformance corpora"), which add ~67s of
# DEBUG-build work — the UCD normalisation closure alone is ~19,000 cases × 6
# normalisations. That is real coverage, not waste, and this cap is a wall-clock budget
# for the whole suite in one process; the meaningful per-case guard is still the inner
# `*test-timeout-ms*`. If this needs raising again, first check whether a single case has
# become slow (fix that instead) rather than reflexively bumping the budget.
#
# Raised 600s → 1200s on 2026-07-27, and the check above was done first, not skipped:
# this wrapper was being SIGKILLed at the 600s cap because a single case *had* become
# pathological — KI-14, the RUNTIME collector re-walking a deep process's whole root
# stack at every safepoint. That is fixed (see docs/known-issues.md), and what's left is
# real work: the wrapper now completes in **562s**, with the release path at 88s for the
# same 3591 cases. 562s against a 600s cap is too thin a margin to be a meaningful signal
# — a loaded CI runner would redden the whole suite for no code reason — so double the
# budget rather than sit one slow scheduling quantum away from a false red. The inner
# `*test-timeout-ms*` (600s here, set in tests/suite.rs) remains the guard that actually
# catches a hung case; this is only the outer wall-clock backstop.
# Raised 1200s → 2700s on 2026-08-11, and the "check for a slow case first" instruction above
# was followed, not skipped. The culprit is not a case, it is the ENGINE: the CI
# `differential (tree-walker)` job runs this same wrapper under `BROOD_VM=0`, and the
# tree-walker is ~10× slower than the VM by design. Measured on one box, same commit:
# **562s under the VM, 954s under the tree-walker** — i.e. the tree-walker was inside a 1200s
# budget by 20% on fast hardware and had no chance on a runner the config elsewhere describes as
# sharing 2 cores with the workspace build.
#
# The arithmetic confirms it. `retries = 1` below means a killed wrapper is attempted twice, so
# 2 × 1200s + ~5 min of checkout/build/setup ≈ **45 min** — and the failing CI job ran
# **45m20s** (08:50:50 → 09:36:10 on 9f06c6c9), exiting 100. That job had been red on four
# consecutive commits with no common code change between them, which is the signature of a
# budget, not a regression. The VM job's Test step passed on every one of those runs.
#
# So this is a wall-clock budget that only ever fitted one of the two engines. 2700s gives the
# tree-walker ~2.8× headroom over its measured 954s. The cost of the raise is that a genuinely
# hung suite now takes 45 min to be killed instead of 20 — acceptable because, as the note above
# says, the guard that actually catches a hung *case* is the inner `*test-timeout-ms*`
# (tests/suite.rs), and this outer cap is only the backstop. If it needs raising again, check the
# engine ratio first: a tree-walker figure much past ~10× the VM's is a real finding.
# Lowered 2700s -> 300s on 2026-08-27, and for the first time by fixing the cause rather
# than raising the number. Every raise above was paying the same tax: `cargo test` built
# opt-level 0, and this suite is an interpreter exercising itself — the workload an
# unoptimized build punishes most. Measured on one commit: **933 s** here against **58 s**
# for the identical cases on the release binary, a 16x profile tax with nothing to do with
# the tests. `[profile.test]` is now `opt-level = 2` with `debug-assertions = true`, so this
# wrapper runs at roughly release speed with every tripwire still armed, and the full,
# UNSAMPLED suite measures **66 s** (against 933 s for the sampled one before).
#
# 300s = 5x headroom over that, which is the right shape for a 2-core runner sharing the box
# with the rest of the workspace. If this ever goes red again, check the ENGINE ratio and the
# profile before touching this number — the history above is a record of what happens
# otherwise.
# Raised 300s -> 900s on 2026-08-30, red for the exact reason the 2026-08-11 note
# warned about: 300s was sized to the VM engine (66s, 5x headroom) and this wrapper
# ALSO runs under the CI `differential (tree-walker)` job's BROOD_VM=0, where the
# same cases measure 196s on a 12-core box with exclusive use — a 2-core shared
# runner sits right on the cap, and 29831e06's run was killed at TRY 2 (the
# job's only failure; the code was exonerated by a local instruction-count A/B).
# 900s = ~4.5x headroom over the measured tree-walker figure; the VM run keeps its
# inner `*test-timeout-ms*` as the guard that catches a hung case, as ever.
[[profile.default.overrides]]
filter = 'binary(suite)'
slow-timeout = { period = "60s", terminate-after = 15 }
# One retry, for the same reason `distribution`/`serve_attach` get one — and with a
# sharper edge here. The in-language suite CONTAINS timing-sensitive cases that talk
# to a local node (`tests/remote_spawn_test.blsp` does a `remote-spawn` round trip),
# and because they run inside this single wrapper case they were the only such tests
# in the workspace with no second chance: one blown deadline under a loaded runner
# reddened all ~3160 of them (observed 2026-07-25 — the same case passed 3/3
# standalone and 2/2 in full re-runs immediately after). The retry costs nothing on a
# green run (nextest only re-runs a FAILED case), a deterministic regression still
# fails both attempts and stays red, and a pass-on-retry is reported as FLAKY so it
# cannot be silently absorbed.
retries = 1

# `completion_never_fails_however_it_is_called` (nest/tests/complete.rs) is 96 child-process
# spawns — 3 project shapes × (2 cheap cases + 6 hostile inputs × 5 completion positions) —
# and the value-position ones each boot an interpreter.
#
# This override used to read `terminate-after = 5` (300 s), raised on 2026-08-14 after the case
# blew the 120 s default at ~60 s solo. That raise was treating the symptom, and the symptom
# came back: on 2026-08-17 the case TIMED OUT at 300 s in CI, reddening the job on all 8 runs
# that day (KI-39 — misfiled as an intermittent tree-walker flake for weeks, because a fixed
# cost against a fixed deadline looks random).
#
# The instruction the old comment left — "prefer shrinking the work… the 6×5 grid is a
# permutation matrix" — was followed on 2026-08-18, but the answer turned out better than a
# coverage trade: the per-spawn cost was the bug. `complete` was requiring all 2967 lines of
# `project` at load time, 770 ms of the 950 ms each spawn took. With that removed the FULL 96-
# spawn matrix runs in **10.5 s** (from 63.8 s), so no coverage was given up at all.
#
# 180 s here, not 300 s and not the 120 s default: 96 subprocess spawns on a 2-core runner
# sharing the box with `brood_suite_passes` legitimately run several times slower than an idle
# one (the measured ratio for this very case was >4.7×), so ~50 s is a plausible bad day and
# 120 s is too thin — but 300 s would now hide a 5× cost regression completely, which is
# exactly how the last one survived. And the real guard is no longer a budget: three asserts in
# `crates/lisp/tests/completion_load_cost.rs` fail immediately if `complete` starts loading
# `project` or `scaffold` again, naming the offending global. Fix a red budget by reading that
# test, not by raising this number.
[[profile.default.overrides]]
filter = 'binary(complete) and test(completion_never_fails_however_it_is_called)'
slow-timeout = { period = "60s", terminate-after = 3 }

# `image_matches_source` (ADR-280) loads EVERY std module twice — once from source, once
# from the freshly built image — and diffs the resulting bindings, so it is the heaviest
# single case outside the suite wrapper by design, and the CI `differential (tree-walker)`
# job runs it at the tree-walker's ~10x. Measured 2026-08-31: 30.5s solo (release-profile
# tests, 12-core box); the 2-core shared runner blew the 120s default on 124fd339
# (TIMEOUT at 120.007s on both tries — the steady repeat of a budget, not a hang). 60s x 6
# = 360s keeps ~3x headroom over a plausible loaded-runner figure; the mismatch this test
# exists to catch fails in seconds, so the budget hides no regression class.
[[profile.default.overrides]]
filter = 'binary(image_matches_source)'
slow-timeout = { period = "60s", terminate-after = 6 }

# --- KI-38: warm the boot cache once, before ~50 binaries fan out ---
#
# The expanded-prelude cache is keyed on `build_id` = version + git sha + the
# running executable's OWN mtime, so a rebuild colds it for every binary at
# once, and the first suite run after a build is a fully cold one. A cold boot
# costs ~1.23 s against ~0.11 s warm — almost entirely macro-expanding the
# prelude (`BROOD_BOOT_TRACE=1`: expand=1.10s of a 1.227s source boot).
#
# The suite spawns `brood`/`nest` children by the dozen in one dense window, and
# they all share ONE cache file (keyed on the child binary, not the caller).
# Cold, the first child does not finish writing it until ~1.2 s in, so every
# child starting inside that window misses too. Cold cost x herd size is linear
# and crosses `wait_until_listening`'s 20 s deadline at ~70 concurrent boots,
# which is how three boot-wait tests came to fail together (KI-38 — reproduced
# on demand at `-j 64` with the cache cleared).
#
# ~2.4 s here, once, so the herd hits a warm cache. The script exits 0 on every
# failure path: warming is an optimisation and must never redden a run.
[scripts.setup.warm-boot-cache]
command = 'scripts/warm-boot-cache.sh'

# --- KI-78: build the stdlib image, so the suite runs the load path users get ---
#
# The image is DEFAULT-ON (v0.15.0, ADR-256/281) and safe by construction when absent, so with
# nothing building one every job ran the SOURCE path while the shipped default was the imaged
# one. Worse, coverage was nondeterministic rather than absent: `image_matches_source.rs`
# (ADR-280) builds an image and writes it to ~/.cache/brood, so whether any other case ran imaged
# depended on which case nextest scheduled first.
#
# The script exits 0 on every failure path (no `nest` built yet => no image => the suite behaves
# as before, which is a correct configuration). Its off switch is BROOD_NO_STDIMAGE=1 — the same
# variable that disables the image at runtime — which is how ci.yml's tree-walker job keeps
# deliberate SOURCE-path coverage instead of the two paths trading places.
[scripts.setup.build-std-image]
command = 'scripts/build-std-image.sh'

[[profile.default.scripts]]
filter = 'all()'
setup = ['warm-boot-cache', 'build-std-image']
