# WASM (browser playground) build support. getrandom 0.3+ selects its entropy
# backend from this cfg; the matching `wasm_js`/`js` features are enabled by the
# target-specific deps in crates/lisp/Cargo.toml. Native builds are unaffected.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
