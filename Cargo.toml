[workspace]
resolver = "2"
members = ["crates/lisp", "crates/cli", "crates/nest", "crates/lsp", "crates/playground"]

[workspace.package]
version = "0.14.1"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Wilhelm Kirschbaum"]

# `cargo test` / `cargo nextest` build this profile. It is OPTIMIZED, deliberately.
#
# Brood's test suite is an interpreter exercising itself, so it is exactly the workload an
# unoptimized build punishes most. Measured 2026-08-27 on the same commit and the same ~1200
# in-language cases: **933 s** for `brood_suite_passes` under the stock (opt-level 0) test
# profile, against **58 s** for the identical suite on the release binary — a **16x** tax that
# is entirely the profile and has nothing to do with the tests.
#
# That tax is what `.config/nextest.toml`'s budget history is a record of: the cap on this one
# wrapper went 300s -> 600s -> 1200s -> 2700s, and its own comments note the release path doing
# the same work in 88 s. Every raise treated the symptom. This treats the cause.
#
# `debug-assertions` stays ON (inherited from `dev`, and stated here so a future edit cannot
# drop it silently). That combination — optimized + assertions armed — is the one CLAUDE.md
# already recommends for manual runs, because it keeps the per-deref GC tripwire and the heap
# verifier live at release speed. The tests must run WITH those armed; they are how a
# use-after-GC is caught at the bad deref instead of as a distant SIGSEGV.
#
# `opt-level = 2`, not 3: on this workload 3 buys little over 2 and costs noticeably more
# compile time, and compile time is the whole price being paid here.
[profile.test]
opt-level = 2
debug-assertions = true

# The lib and its dependencies as built FOR the tests. `cargo test` compiles the crate under
# test with `profile.test`, but its path dependencies come from `profile.dev` — and for this
# workspace the code under test (`crates/lisp`) is a dependency of every other crate's test
# binaries, so leaving `dev` at opt-level 0 would leave most of the tax in place.
[profile.dev]
opt-level = 2
debug-assertions = true

# The runtime `nest release` appends an app to (ADR-038). Inherits `release` and
# squeezes the shipped binary: `strip` drops symbols + debug info; fat `lto` +
# a single codegen unit cross-module-inline and dead-code-eliminate the whole
# (lean, `--no-default-features`) tree. Built once and cached — changing the app
# only re-appends the archive, so LTO's cost is paid a single time. Kept off the
# default `release` profile so `make install` / benches stay fast to build.
[profile.release-lean]
inherits = "release"
strip = true
lto = true
codegen-units = 1

# What `make install` builds: an optimized binary that is `strip`ped but does NOT
# pay any LTO — parallel codegen keeps the build fast (no serial, minutes-long
# link). The local-install counterpart of `release-lean`: same stripping, none of
# the LTO build cost. Trade-off: the binary is bigger (~36 MB vs ~10 MB) because
# only fat LTO + codegen-units=1 dead-code-eliminates the big jit/gui/treesit dep
# tree — and thin LTO, measured, gave no size win here while building slower, so
# it's not worth it. `nest release` still uses fat-LTO `release-lean` for the
# shippable runtime. (A profile `strip` reliably strips the final binary;
# `RUSTFLAGS=-C strip` does not.)
[profile.release-fast]
inherits = "release"
strip = true
