[workspace]
resolver = "2"
members = ["crates/lisp", "crates/cli", "crates/nest", "crates/lsp", "crates/playground", "crates/tab"]

[workspace.lints.rust]
# `brood_asan` is set by the `asan` make target (`--cfg brood_asan`) so the instrumented
# build can size `WORKER_STACK_BYTES` for ASAN's fatter frames. Registered here so an
# ordinary build does not warn about an unknown cfg under `-D warnings`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(brood_asan)'] }

[workspace.lints.clippy]
# Every `unsafe` block says, in a `// SAFETY:` comment directly above it, the invariant that
# makes it sound, so the reason lives next to the code instead of in a reader's guesswork.
# Clippy runs under `-D warnings`, so this is a hard gate.
undocumented_unsafe_blocks = "warn"

[workspace.package]
version = "0.51.0"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["Wilhelm Kirschbaum"]
# The minimum Rust this builds on. NOT a frozen toolchain — CI deliberately tracks `stable`
# (see .github/workflows/package-ci.yml: "a warning for the whole ecosystem rather than a
# check against a frozen toolchain"), and pinning would defeat that. This makes the
# requirement *legible* instead.
#
# Nothing declared it until 2026-08-28, and the failure mode was a bad one: `types/mod.rs`
# and `types/display.rs` briefly used `isolate_lowest_one` — stable only from 1.98 — so a
# build on 1.95 produced `error[E0658]: use of unstable library feature
# 'isolate_most_least_significant_one'`, which reads as "this code is wrong" rather than
# "your toolchain is old", and names no version to move to. Both sites now iterate the tag
# table instead, and 1.95 became the floor; with this line cargo says "requires
# rustc N or newer, while the currently active rustc version is …" instead of an E0658.
#
# Raised to **1.96** on 2026-10-15: wasmtime 49 and cranelift 0.136 declare
# `rust-version = "1.96.0"`. Verified with `cargo +1.96 check --workspace --all-targets`.
#
# Raised to **1.97** on 2026-10-28: wasmtime 50 and cranelift 0.137 declare
# `rust-version = "1.97.0"`. Verified with `cargo +1.97 check --workspace --all-targets`.
#
# Raise it deliberately, never by accident: a bump is a real compatibility decision, and this
# is the one place it is visible. Verify by building on the version you claim — the number
# below is the oldest actually exercised, not a guess.
rust-version = "1.97"

# The test and dev profiles are OPTIMIZED with debug assertions armed and line-table debuginfo
# — a 16x suite-time difference, measured. Why each key: docs/build-and-ci.md.
[profile.test]
opt-level = 2
debug-assertions = true
debug = "line-tables-only"

# What the lib is built as FOR the tests (path dependencies take `dev`, not `test`).
[profile.dev]
opt-level = 2
debug-assertions = true
debug = "line-tables-only"

# The runtime `nest release` appends an app to (ADR-038). Inherits `release` and
# squeezes the shipped binary: `strip` drops symbols + debug info; fat `lto` +
# a single codegen unit cross-module-inline and dead-code-eliminate the whole
# (lean, `--no-default-features`) tree. Built once and cached — changing the app
# only re-appends the archive, so LTO's cost is paid a single time. Kept off the
# default `release` profile so `make install` / benches stay fast to build.
[profile.release-lean]
inherits = "release"
strip = true
lto = true
codegen-units = 1

# The **playground wasm** (`crates/playground`), which is downloaded by every visitor to
# the site, so bytes matter more than throughput — `opt-level = "s"` over the default `3`.
#
# This lives HERE, not in `crates/playground/Cargo.toml`, because cargo ignores a
# workspace *member's* profiles: the crate carried exactly these two settings and they had
# never applied (the wasm was built with the default `release`), which cargo warned about
# on every single build of the workspace. It also cannot go in a root `[profile.release]`,
# because `release-lean` and `release-fast` — what `make install` and `make ab` build —
# inherit from it and would silently take `opt-level = "s"` with them, quietly changing
# the benchmark baseline.
#
# Every site that builds the wasm must pass `--profile release-wasm` (and read from
# `target/wasm32-unknown-unknown/release-wasm/`): hive's Dockerfile, CI's wasm job, and
# `scripts/wasm-receive-timeout-repro.sh`.
[profile.release-wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

# The **tab wasm** (`crates/tab`): a game kept running in a page, where every frame is
# interpreted (wasm has no JIT), so throughput matters more than bytes — `opt-level = 3`,
# otherwise `release-wasm`. Measured on b2d's demo: see `crates/tab`.
[profile.release-tab-wasm]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1

# What `make install` builds: an optimized binary that is `strip`ped but does NOT
# pay any LTO — parallel codegen keeps the build fast (no serial, minutes-long
# link). The local-install counterpart of `release-lean`: same stripping, none of
# the LTO build cost. Trade-off: the binary is bigger (~36 MB vs ~10 MB) because
# only fat LTO + codegen-units=1 dead-code-eliminates the big jit/gui/treesit dep
# tree — and thin LTO, measured, gave no size win here while building slower, so
# it's not worth it. `nest release` still uses fat-LTO `release-lean` for the
# shippable runtime. (A profile `strip` reliably strips the final binary;
# `RUSTFLAGS=-C strip` does not.)
[profile.release-fast]
inherits = "release"
strip = true
