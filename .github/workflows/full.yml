name: Full (weekly)

# The ABSOLUTELY FULL run: everything per-push CI (ci.yml) leaves out because it would make
# every push wait — the tree-walker differential (~40 min), the repeat runs, GC stress, the
# stress suite, the tier audit, the soaks (one of them 2 h) and the sanitizers. Weekly, plus
# `gh workflow run full.yml` before a release or after a change to the engines. This was the
# daily "Nightly" until 2026-11-05; it went weekly when the tree-walker job moved here, so
# per-push CI could answer in ~12 minutes instead of ~40.

# CI answers "did this commit pass?" — once. It cannot answer the question CLAUDE.md
# actually asks, which is "is this tree green?", because a one-in-N race passes N-1 runs
# out of N and a single pass is not evidence. Everything here is the repetition and the
# armed tripwires that a per-push gate cannot afford to run.
#
# The class this exists for, concretely: KI-103 was a check-then-act race on the mailbox
# overflow flag. Both engines were already covered per push (CI's `test` and
# `differential` jobs), the breakage suite was already green, and none of it mattered —
# the failure needed a particular interleaving, so it showed up as an intermittent red
# that looked like a flaky test and was filed as "not reproducible" for a fortnight.
#
# Weekly, not per-push, deliberately: these are minutes-expensive and their findings are
# rarely attributable to one commit anyway. A red here is a bug hunt, not a bisect.

on:
  schedule:
    # Sunday 03:00 UTC — after the week's pushes, before the next week starts.
    - cron: "0 3 * * 0"
  workflow_dispatch:

# Unlike CI's, this concurrency group does NOT cancel in progress: a full run that is
# cancelled by a manual dispatch has told nobody anything, and the whole value here is
# in runs that actually finish.
concurrency:
  group: full
  cancel-in-progress: false

jobs:
  # A one-in-N race needs N runs. Three independent runners rather than three serial
  # iterations, so wall-clock stays one suite and a single red run is still legible.
  repeat:
    name: suite, run ${{ matrix.run }} of 3
    runs-on: ubuntu-latest
    strategy:
      # Every run finishes: "runs 1 and 3 passed, 2 failed" is the actual finding, and
      # fail-fast would throw away the frequency, which is the most useful thing a flake
      # tells you.
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # Pinned like ci.yml's, never the floating `@nextest` tag.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.150

      # Identical to CI's `test` step on purpose. A nightly that runs a DIFFERENT command
      # from the per-push gate cannot tell a flake from a configuration difference.
      - name: Test (nextest)
        run: scripts/nextest-no-flakes.sh --no-fail-fast --features brood/treesit-grammars

  # `make gcstress` runs nowhere else: GC_STRESS collects at every safepoint, so a handle
  # held across a collection is caught every time rather than when a threshold collection
  # happens to land in the window (KI-57). The target builds DEBUG on purpose.
  gcstress:
    name: GC stress + verify (concurrency and mailbox tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: make gcstress
        run: make gcstress

      # The twelve files above are where values cross heaps, but a handle held across a
      # collection is not confined to them: any builtin that allocates twice can strand the
      # first allocation. This is every tests/*_test.blsp under the same flags (~12
      # CPU-minutes; ~80 s on a 12-core box), which is why it is here and not per push.
      - name: make gcstress-all (every test file)
        if: always()
        run: make gcstress-all LOGS=/tmp/gcstress-all JOBS=2

      # The target writes a per-file log and prints only the first few lines of a
      # failure; keep the whole thing, because a use-after-GC report is a path through
      # the heap graph and the interesting part is rarely in the first five lines.
      - name: Upload the stress logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gcstress-logs
          path: |
            /tmp/gcstress.*.log
            /tmp/gcstress-all/
          if-no-files-found: warn

  # The manual gates. A gate nobody runs reports nothing, so these rotted silently for
  # weeks when they were run only by hand; nightly turns "broken for weeks" into
  # "broken for a day".
  stress:
    name: stress suite (fuzz differential, scaling, property/race, 3 engines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # `stress/run.sh` wants the debug-assertions release binary its harnesses assume.
      - name: Build (release, debug-assertions armed)
        run: RUSTFLAGS="-C debug-assertions=on" cargo build --release -p cli

      # The scaling arm SKIPS itself under 8 cores (GitHub's runners are 2-4), so this is
      # the fuzz differential, the property/race corpus and the checker-soundness corpus.
      # That is the half that caught the stale generator; the scaling half stays local.
      - name: make stress
        run: ./stress/run.sh

      - name: Upload divergent seeds (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: stress-fuzz-seeds
          path: stress/fuzz_out/
          if-no-files-found: warn

  # The tier audit: every benchmark row under BROOD_JIT_BAIL_TRACE, failing on an arm that
  # lowered and then could not stay native (a deopt-thrash or suspend latch) or a lowering
  # bug (KI-132's class). Every per-push gate is a VALUE gate and these produce the right
  # answer slowly, so nothing else here can see one. A value gate too, not a timing one, so a
  # shared runner is fine — unlike `make latency-gate`, which is a benchmark-box gate
  # (docs/benchmarking.md) and runs in `make green-all` instead.
  tier-audit:
    name: tier audit (every hot benchmark arm stays native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The rows live in their own (public) repository; checked out inside the workspace,
      # since actions/checkout refuses a sibling path, and named with BENCH_DIR.
      - uses: actions/checkout@v7
        with:
          repository: broodlang/brood-benchmarks
          path: brood-benchmarks
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # The audit greps for BAD lines, so it passes vacuously on a missing checkout (which
      # it reports as "skipped", exit 0) and on a binary that never reaches the native tier.
      # Both are asserted first.
      - name: make tier-audit
        shell: bash
        run: |
          set -euo pipefail
          test -d "$GITHUB_WORKSPACE/brood-benchmarks/bench/brood" \
            || { echo "::error::no benchmark rows checked out"; exit 1; }
          make release-brood
          # `system/features`, not `%native-tier?`: the audited build is the lean release one,
          # which has no dev-tools primitives. Nothing in this job lowers the BROOD_TIER ceiling.
          echo '(io/puts (pr-str (system/features)))' > features.blsp
          target/release-fast/brood features.blsp | grep -q ':jit' \
            || { echo "::error::the audited brood has no native tier"; exit 1; }
          make tier-audit BENCH_DIR="$GITHUB_WORKSPACE/brood-benchmarks" | tee tier-audit.log
          grep -q "every hot arm stayed native" tier-audit.log

  # KI-88 (a spawn never scheduled) and KI-127 (an autoload fan hung) were never root-caused
  # and sit behind watchdogs. This boots the concurrency soak fresh for 30 minutes — first
  # module loads raced across a fan, warm spawn bursts, link churn — cycling tiers, one
  # worker and the GC verifier, and fails on a lost process or any watchdog line.
  runtime-soak:
    name: runtime soak (spawn bursts, module-load races, 30 min)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build (release, debug-assertions armed)
        run: RUSTFLAGS="-C debug-assertions=on" cargo build --release -p cli

      - name: Soak
        run: ./stress/runtime_soak.sh 1800

      - name: Upload the soak logs (always — a clean hunt is evidence too)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-soak-logs
          path: target/runtime-soak/
          if-no-files-found: warn

  # ROADMAP Supervision G: the gap that remains is duration, not features. Three relay nodes
  # and a hub pass a token around a ring for two hours while a relay is hard-killed every two
  # minutes and restarted; each relay's supervisor also restarts a child told to crash. The
  # weekly `Soak` workflow runs the same thing under GC stress.
  node-soak:
    name: node soak (3-node ring, a node killed every 2 min, 2 h)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build (release, debug-assertions armed)
        run: RUSTFLAGS="-C debug-assertions=on" cargo build --release -p cli

      - name: Soak
        run: ./stress/node_soak.sh 7200 120

      - name: Upload the soak logs (always — a clean hunt is evidence too)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: node-soak-logs
          path: target/node-soak/
          if-no-files-found: warn

  # The `perf-stats` feature compiles counter increments into the VM/JIT hot paths
  # (vm_run_bc, deopt, the JIT call lowering, the background compiler). No other job
  # builds it, so a cfg'd seam there could rot — or a counter could perturb an engine —
  # unnoticed. A targeted set: the JIT and engine-differential binaries, which drive
  # exactly those paths, plus the in-language perf triage tests on a counter-armed brood
  # (where `perf/report` must report real counters, not its no-data branch).
  perf-stats:
    name: perf-stats build (JIT + differential + perf triage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.150

      - name: Test (nextest, --features brood/perf-stats, targeted)
        run: >-
          cargo nextest run -p brood --features brood/perf-stats --no-fail-fast
          -E 'binary(jit) | binary(differential) | binary(jit_suspend_latch) | binary(jit_tier_frame_pairing)'

      - name: perf triage tests on a counter-armed brood
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p cli --features brood/perf-stats
          target/debug/brood --test tests/perf_test.blsp
          # The counters must actually be compiled in and dumped: a perf-stats build that
          # prints the "counters not compiled in" hint is the failure this job exists for.
          echo '(io/puts (fold (range 1000) 0 (fn (total x) (+ total x))))' > perf-smoke.blsp
          out=$(BROOD_PERF_STATS=1 target/debug/brood perf-smoke.blsp 2>&1)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Eq '\[vm-perf\] +vm_apply +[1-9]' \
            || { echo "::error::BROOD_PERF_STATS dumped no non-zero vm_apply counter"; exit 1; }

  # ASAN over the kernel-exercising tests: genuine OOB / use-after-free in the unsafe
  # substrate (the mmap table, the JIT codegen buffers) that TSAN and the logical GC
  # tripwires cannot see.
  #
  # Runs EVERYTHING, with a long timeout rather than a skip filter. The `jit` binary's
  # cases warm the JIT with real iteration counts and take many minutes under
  # instrumentation, so the temptation is to filter them out — but the obvious filter
  # (`--skip jit_`) matches none of them (they are named `..._under_jit`), which would be a
  # no-op that reads exactly like a working exclusion. A slow nightly job is honest; a
  # filter that silently skips nothing is the failure mode this whole section exists for.
  asan:
    name: AddressSanitizer (kernel tests)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Pinned like ci.yml's: `make asan` runs through nextest (process per test).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.150

      - name: make asan
        run: make asan

  # ThreadSanitizer, the loom model check and the Shuttle model check. All three are fast; they
  # are here rather than in CI only because TSan needs a nightly toolchain.
  tsan-loom:
    name: ThreadSanitizer + loom + shuttle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: make tsan
        run: make tsan

      - name: make loom
        run: make loom

      - name: make shuttle
        run: make shuttle

  # Miri interprets the kernel's unit tests and stops at undefined behaviour in `unsafe` code
  # that ASan cannot see — an aliasing violation, an invalid value, a misaligned read — which
  # is what every `// SAFETY:` comment claims cannot happen. Only the modules Miri can run
  # (`make miri`'s MIRI_MODULES): no JIT, no foreign calls.
  miri:
    name: Miri (kernel unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: make miri
        run: make miri

  # The ADR-076 differential gate — the whole suite through the tree-walker
  # (`BROOD_TIER=0`), the second half of `make test-both`. The VM is
  # the default engine and `differential.rs` already checks per-expression
  # agreement inside the normal run, so this is the belt-and-braces pass that
  # catches a divergence only a full tree-walked suite would show.
  #
  # The tree-walker is ~10x slower than the VM (CLAUDE.md): ~40 minutes, which made it the
  # whole wait of every per-push CI run. It runs here, weekly and on dispatch (moved from
  # ci.yml 2026-11-05) — the same trade-off that keeps `test-both` out of `make check`.
  tree-walker:
    name: differential (tree-walker)
    runs-on: ubuntu-latest
    steps:
      # The tree-walked suite's debug build, its nextest log and the rust cache outgrew the
      # runner's free disk: the runner died with "No space left on device" twice in a row
      # (2026-11-04/05). The preinstalled toolchains this job never uses are ~30 GB.
      - name: Free disk space
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell
          df -h /
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # Pinned for the same reason as build-test's.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.150

      # No --all-features here: this job only needs the default surface (the
      # engine under test), so it skips the gui/audio system-dep install above.
      #
      # Output is tee'd so the step below can upload it. Reading a run's LOG needs admin on
      # the repository (`/actions/runs/:id/logs` → 403 otherwise), which means a failure here
      # is undiagnosable to anyone without it — and this job fails in ways that do not
      # reproduce locally, so "read the log" is exactly what one needs to do. An artifact is
      # downloadable with plain read access (`gh run download`), so the failing case travels
      # out of CI regardless of permissions. `pipefail` keeps the tee from masking the exit
      # code.
      # `--failure-output immediate-final` repeats every failure in one block at the end, which
      # is what makes the parse below a parse rather than a guess.
      - name: Test (nextest, BROOD_TIER=0)
        id: tw
        env:
          BROOD_TIER: 0
          # KI-78: this job, already the "other configuration", also keeps the stdlib image's
          # and the prelude image's SOURCE paths covered (both artifacts are default-on, so
          # without this every job would run imaged). BROOD_NO_STDIMAGE is also the nextest
          # `build-std-image` setup script's own off switch.
          BROOD_NO_STDIMAGE: 1
          BROOD_NO_PRELUDE_IMAGE: 1
        shell: bash
        run: |
          set -o pipefail
          # `--color never`: nextest colours its output under CI even into a pipe, and every
          # pattern the annotate step below greps for anchors on `WORD [` — which a coloured log
          # writes as `WORD<ESC>[0m [`. That mismatch is why KI-39 went three sightings without
          # ever naming a case. The step also strips ANSI defensively; this makes it moot.
          # `--profile tree-walker` (.config/nextest.toml): this engine outgrew the default
          # 15-minute suite budget and passed only on its retry; that profile gives the suite
          # 25 minutes here and nowhere else.
          # Through `nextest-no-flakes.sh`: a test that passes only on its retry fails the job.
          NEXTEST_LOG=tree-walker-nextest.log scripts/nextest-no-flakes.sh \
            --profile tree-walker --no-fail-fast --failure-output immediate-final --color never

      # Name the failing cases as workflow ERROR commands, which GitHub turns into check-run
      # ANNOTATIONS. This exists because of a permissions asymmetry that cost real time on
      # KI-39: a run's *log* needs admin on the repository (`/actions/runs/:id/logs` → 403,
      # `rerun-failed-jobs` → 401), but annotations are readable with plain read access
      # (`gh api repos/:o/:r/check-runs/:id/annotations`). Before this, the only annotation a
      # failure produced was the runner's own "Process completed with exit code 100" — which
      # says a test failed and nothing about which, so a job that does not reproduce locally
      # was undiagnosable without admin. The artifact below covers the same gap; this is the
      # cheaper half, since it needs no download and shows on the run page.
      #
      # nextest marks failures as `        FAIL [   1.234s] binary case_name`, and a suite
      # wrapper prints its own inner failures as `    tests/foo_test.blsp:12: test failed: …`.
      # Emit both, deduplicated, capped so a mass failure cannot bury the summary.
      - name: Annotate the failing cases (on failure)
        if: failure() && steps.tw.outcome == 'failure'
        shell: bash
        run: |
          if [ ! -f tree-walker-nextest.log ]; then
            echo "::error::tree-walker: no nextest log — the step failed before running tests"
            exit 0
          fi

          # Grep a de-ANSI'd COPY, never the raw log. nextest colours under CI, so the raw log
          # holds `Summary<ESC>[0m [1922.084s]` and a `Summary \[` pattern cannot match it — the
          # exact reason this step reported nothing for three KI-39 sightings while the run page
          # showed a green annotate step. `--color never` above prevents it at the source; this
          # keeps the step correct even if that regresses or a tool colours anyway.
          sed -E $'s/\x1b\\[[0-9;]*[A-Za-z]//g' tree-walker-nextest.log > tree-walker-plain.log

          # A case can end in more ways than FAIL: `TIMEOUT [ 300.010s]` is how the run of
          # 2026-08-17 actually failed, and it matched none of the original three patterns.
          grep -hoE '^[[:space:]]*(TRY [0-9]+ )?(FAIL|TIMEOUT|SIGSEGV|SIGABRT|ABORT|LEAK) \[[^]]*\] .*' tree-walker-plain.log \
            | sed 's/^[[:space:]]*//' | sort -u | head -25 \
            | while IFS= read -r line; do echo "::error::tree-walker nextest: $line"; done || true
          # `(:[0-9]+)?` for the column: the harness reports some failures as `file:line:col:`
          # and others as `file:line:`. Tested against a real two-failure log — without the
          # optional column this missed `registry_test.blsp:55:9` and annotated only half the
          # failures, which is worse than annotating none.
          grep -hoE 'tests/[A-Za-z0-9_./-]+\.blsp:[0-9]+(:[0-9]+)?: test failed: .*' tree-walker-plain.log \
            | sort -u | head -25 \
            | while IFS= read -r line; do echo "::error::tree-walker in-language: $line"; done || true
          # A summary line regardless, so the annotation set is never empty on a failure.
          grep -hoE 'Summary \[[^]]*\].*' tree-walker-plain.log | tail -1 \
            | while IFS= read -r line; do echo "::error::tree-walker $line"; done || true

          # UNCONDITIONAL FALLBACK. Run 32054863012 (2026-08-17) proved the greps are not enough
          # on their own: the step ran and SUCCEEDED (the `|| true` fix works) yet emitted no
          # annotation at all — not even the Summary line, which nextest always prints. The cause
          # was the ANSI mismatch fixed above, found only by finally downloading the artifact.
          #
          # A diagnostic that reports nothing when its patterns miss is the failure mode this
          # whole step exists to avoid (KI-39 lost three sightings to exactly that). So: if
          # nothing above matched, annotate the log's tail verbatim. Ugly, bounded, never silent.
          if ! grep -qE '(FAIL \[|TIMEOUT \[|test failed:|Summary \[)' tree-walker-plain.log; then
            echo "::error::tree-walker: none of the failure patterns matched this log — dumping its tail"
            tail -30 tree-walker-plain.log \
              | while IFS= read -r line; do
                  [ -n "$line" ] && echo "::error::tree-walker raw: $line"
                done || true
            echo "::error::tree-walker: log is $(wc -l < tree-walker-plain.log) lines, $(wc -c < tree-walker-plain.log) bytes"
          fi

      - name: Upload the tree-walker log (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tree-walker-nextest-log
          path: tree-walker-nextest.log
          retention-days: 14

