name: Brood package CI

# The ONE definition of what a Brood package's CI does, called by every package repo
# (see `.github/workflows/ci.yml` in each) rather than copied into it. Eleven copies of
# this file meant the next change to the gate was eleven edits, and they would drift —
# which is exactly how a gate stops meaning the same thing everywhere.
#
# Why it exists at all: there was no CI on any package in this org, and the cost was
# concrete. hatch was broken from brood 0.11.0 — `(/stop sup)` reaching for a root `stop`
# that had become `gen/stop` — and nothing noticed for two releases, until a hive deploy
# crash-looped in production on a different stale name. Its first run here found a second
# one: `server/start` returned before its listener was accepting.
#
# brood is built from source and tracks `main` deliberately: that makes this an early
# warning for the whole ecosystem rather than a check against a frozen toolchain.

on:
  workflow_call:
    inputs:
      brood-ref:
        description: "Which brood to build against. Defaults to main — the early-warning behaviour; `last-green` is the newest main commit whose own CI passed every job (ci.yml advances it), so a main that does not build reddens no package."
        type: string
        required: false
        default: main
      run-tests:
        description: "Set false for a repo whose suite needs services CI does not have."
        type: boolean
        required: false
        default: true
      boot-check:
        description: >-
          Also run `nest run --for`, before the suite, so a project that checks
          green but cannot START fails fast rather than on deploy. Off by
          default: a library has no `:main`, and bedit/pong need a GUI a runner has
          not got. See KI-66 — hive went down twice on exactly this.
        type: boolean
        required: false
        default: false
      boot-seconds:
        description: "How long the boot check waits before calling it a success."
        type: string
        required: false
        default: "6s"
      postgres:
        description: >-
          Start a Postgres 16 container and export the PG* env its suite reads.
          For an adaptor whose tests need a real server — the alternative was
          `run-tests: false`, i.e. a driver whose driving is never exercised.
        type: boolean
        required: false
        default: false
      test-partitions:
        description: >-
          Split `nest test` over this many parallel jobs (`--partitions N --shard K`). A run
          waits for its slowest job, so a suite of minutes is cut by about this factor; each
          shard pays ~30 s of setup (checkout, the cached toolchain, `nest fetch`).
        type: number
        required: false
        default: 1

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The toolchain, once per run: built here (or found in the cache), then restored by the
  # check job and every test shard, which run side by side.
  brood:
    name: brood toolchain
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.brood.outputs.sha }}
      shards: ${{ steps.shards.outputs.list }}
    steps:
      # The toolchain is the expensive part, so it is cached on the brood commit it
      # was built from — a brood push invalidates it, which is exactly when a rebuild
      # is wanted.
      - name: Resolve brood HEAD
        id: brood
        run: echo "sha=$(git ls-remote https://github.com/broodlang/brood.git "${{ inputs.brood-ref }}"  | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: The test shards
        id: shards
        run: echo "list=$(seq 0 $(( ${{ inputs.test-partitions }} - 1 )) | jq -cs .)" >> "$GITHUB_OUTPUT"

      - name: Cache the brood toolchain
        id: cache-brood
        uses: actions/cache@v6
        with:
          path: ~/.local/bin
          key: brood-bin-${{ runner.os }}-${{ steps.brood.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable
        if: steps.cache-brood.outputs.cache-hit != 'true'

      - name: Fetch brood
        if: steps.cache-brood.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "${{ inputs.brood-ref }}" https://github.com/broodlang/brood.git "$RUNNER_TEMP/brood"

      # A brood push misses the toolchain cache above every time, and built cold that was
      # ~5.5 minutes of every package run. The target directory is cached too, so a miss
      # recompiles only the brood crates that changed, not the dependency graph.
      - uses: Swatinem/rust-cache@v2
        if: steps.cache-brood.outputs.cache-hit != 'true'
        with:
          workspaces: ${{ runner.temp }}/brood
          prefix-key: package-ci-brood
          cache-on-failure: true

      - name: Build brood
        if: steps.cache-brood.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP/brood"
          # `cargo build` rather than `make install`: the default cargo features already
          # include `dev-tools`, which is what carries `nest test` — the lean
          # `RUN_FEATURES` build does NOT have it, so a package's suite could not run.
          # Going through cargo also skips ./configure and the gui/audio system-library
          # question entirely, which a bare runner does not have.
          # `treesit-grammars` links the bundled tree-sitter grammars (`ruby`, `elixir`).
          # They are opt-in, and without them a package with language modes fails only
          # in CI — bedit's ruby-mode/elixir-mode tests passed locally, where the
          # installed brood was built with them, and failed here.
          cargo build --release --features brood/treesit-grammars --bin brood --bin nest
          mkdir -p "$HOME/.local/bin"
          cp target/release/brood target/release/nest "$HOME/.local/bin/"

  check:
    name: check + format
    needs: brood
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore the brood toolchain
        uses: actions/cache/restore@v6
        with:
          path: ~/.local/bin
          key: brood-bin-${{ runner.os }}-${{ needs.brood.outputs.sha }}
          fail-on-cache-miss: true

      - name: Resolve dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          [ -f project.blsp ] && nest fetch || echo "no project.blsp — nothing to fetch"

      - name: nest check
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          nest check

      - name: nest format --check
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          nest format --check

  test:
    name: test${{ inputs.test-partitions > 1 && format(' (shard {0})', matrix.shard) || '' }}
    needs: brood
    if: inputs.run-tests || inputs.boot-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.brood.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7

      - name: Restore the brood toolchain
        uses: actions/cache/restore@v6
        with:
          path: ~/.local/bin
          key: brood-bin-${{ runner.os }}-${{ needs.brood.outputs.sha }}
          fail-on-cache-miss: true

      - name: Resolve dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          [ -f project.blsp ] && nest fetch || echo "no project.blsp — nothing to fetch"

      # Started as a plain container rather than a job-level `services:` block, because a
      # `services:` mapping cannot be made conditional — every caller would pay for a
      # Postgres it does not use.
      - name: Start Postgres
        if: inputs.postgres
        run: |
          set -uo pipefail
          docker run -d --name ci-postgres \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_USER=postgres -e POSTGRES_DB=postgres \
            -p 5432:5432 postgres:16-alpine
          # The container is up long before the server accepts connections; poll rather
          # than sleep a guessed interval.
          ready=""
          for i in $(seq 1 60); do
            if docker exec ci-postgres pg_isready -U postgres -q; then ready=yes; break; fi
            sleep 1
          done
          # Say WHY on failure. Without this the loop runs its 60 turns in silence and the
          # step ends on a bare `pg_isready` exit code, so an image-pull failure, a port
          # clash and a genuinely slow server are indistinguishable — and the whole gate
          # reads as "store-postgres is broken" when nothing in the package moved. Seen
          # 2026-08-31 on store-postgres 4c570f80, whose code was green locally.
          if [ -z "$ready" ]; then
            echo "::error::Postgres did not accept connections within 60s — diagnostics follow"
            docker ps -a || true
            docker logs ci-postgres 2>&1 | tail -40 || true
            exit 1
          fi
          docker exec ci-postgres pg_isready -U postgres

      - name: Boot check
        if: inputs.boot-check && matrix.shard == 0
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # Exits nonzero with the raised error if the entry point dies; exits 0 if it
          # survives the window. This is the gate `nest check` and `nest test` cannot be:
          # neither evaluates `main`, and that is where a stale dependency actually fails.
          nest run --for "${{ inputs.boot-seconds }}"

      - name: nest test
        if: inputs.run-tests
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if [ "${{ inputs.test-partitions }}" -gt 1 ]; then
            nest test --partitions "${{ inputs.test-partitions }}" --shard "${{ matrix.shard }}"
          else
            nest test
          fi
