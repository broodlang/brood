name: CI

# Mirrors the local pre-commit gate (`make check`, plus `make fmt --check`):
#   fmt --check  →  clippy (all targets + all features, warnings fatal)  →  tests.
# Kept in lockstep with the Makefile so "green locally" and "green in CI" mean the
# same thing. `--all-features` builds the gui/audio/jit/treesit surface, which needs
# the system dev libraries installed in the build-test job below.

on:
  push:
    branches: [main]
  pull_request:
  # So the expensive tree-walker differential job (below, main-push only) can be
  # run on demand against a branch before merging.
  workflow_dispatch:

# One in-flight run per ref; a new push cancels the previous run for that ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Formatting is a cheap, dependency-free gate — it needs neither the system
  # libraries nor a compiled build, so it runs on its own and fails fast.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Lint + test together: both need the full --all-features build (gui/audio/jit/
  # treesit), so they share the one toolchain, system-dep install, and cache.
  build-test:
    name: clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # System libraries for the --all-features surface: libasound2-dev for the
      # `audio` feature (rodio→cpal links libasound.so.2), and the windowing /
      # GL / clipboard stack for `gui`/`gui-gpu` (winit, softbuffer, glutin+glow,
      # arboard — X11 + Wayland + xkbcommon + OpenGL). A default build needs none
      # of these; they're only for the all-features lint/test here.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # Same invocation as `make clippy`: all targets, all features, warnings fatal.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The no-JIT configuration (`BROOD_NO_JIT` has a build-level counterpart —
      # CLAUDE.md documents `--no-default-features` as supported). It broke silently
      # once (ungated `crate::jit` refs, found 2026-07-19); this check keeps every
      # `#[cfg(feature = "jit")]` seam honest without a second full test run.
      - name: Check (no default features)
        run: cargo check --workspace --no-default-features

      # Same as `make test`: nextest process-isolates each case (a green-process
      # stack overflow can SIGSEGV, so isolation keeps one bad case from taking the
      # whole run down) and the grammar tests need the vendored tree-sitter parsers.
      - name: Test (nextest)
        run: cargo nextest run --no-fail-fast --features brood/treesit-grammars

      # nextest doesn't run doctests; run them separately so future ones are covered.
      - name: Doctests
        run: cargo test --doc

      # The advisory type checker's ONE hard reject, which is batch/CI-only by
      # design (ADR-123/124/125/126): the checker never gates the live image, so
      # nothing but a run like this one can hold `std/` + `tests/` at zero
      # warnings. `nest check` exits 1 on any warning. The repo root is not a
      # `nest` project (no Brood.toml), so the file-list form is the right one —
      # it loads the project image first, so cross-module and qualified names
      # still resolve. Deliberate lints opt out in-source with `check-allow`.
      #
      # Reached zero 2026-07-31 (was 81 on 2026-07-25): every deliberate
      # non-tail recursion in std/ + tests/ now carries a justified
      # `(check-allow :non-tail-recursion …)`, the bootstrap `append--2` became
      # tail-recursive, and `gui-open`'s Sig admits its nil-able optionals. Keep
      # it at zero — a new warning here is either a real finding or a missing
      # justified opt-out.
      - name: Type-checker gate (nest check — zero warnings)
        shell: bash
        run: |
          shopt -s globstar nullglob
          cargo run -q -p nest --features brood/treesit-grammars -- \
            check std/**/*.blsp tests/**/*.blsp

  # The ADR-076 differential gate — the whole suite through the tree-walker
  # escape hatch (`BROOD_VM=0`), the second half of `make test-both`. The VM is
  # the default engine and `differential.rs` already checks per-expression
  # agreement inside the normal run, so this is the belt-and-braces pass that
  # catches a divergence only a full tree-walked suite would show.
  #
  # The tree-walker is ~10x slower than the VM (CLAUDE.md), so this would roughly
  # triple PR latency for a rarely-firing gate. It runs on main pushes and on
  # manual dispatch instead — the same trade-off that keeps `test-both` out of
  # the local `make check`.
  tree-walker:
    name: differential (tree-walker)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # No --all-features here: this job only needs the default surface (the
      # engine under test), so it skips the gui/audio system-dep install above.
      #
      # Output is tee'd so the step below can upload it. Reading a run's LOG needs admin on
      # the repository (`/actions/runs/:id/logs` → 403 otherwise), which means a failure here
      # is undiagnosable to anyone without it — and this job fails in ways that do not
      # reproduce locally, so "read the log" is exactly what one needs to do. An artifact is
      # downloadable with plain read access (`gh run download`), so the failing case travels
      # out of CI regardless of permissions. `pipefail` keeps the tee from masking the exit
      # code.
      # `--failure-output immediate-final` repeats every failure in one block at the end, which
      # is what makes the parse below a parse rather than a guess.
      - name: Test (nextest, BROOD_VM=0)
        id: tw
        env:
          BROOD_VM: 0
        shell: bash
        run: |
          set -o pipefail
          cargo nextest run --no-fail-fast --failure-output immediate-final 2>&1 \
            | tee tree-walker-nextest.log

      # Name the failing cases as workflow ERROR commands, which GitHub turns into check-run
      # ANNOTATIONS. This exists because of a permissions asymmetry that cost real time on
      # KI-39: a run's *log* needs admin on the repository (`/actions/runs/:id/logs` → 403,
      # `rerun-failed-jobs` → 401), but annotations are readable with plain read access
      # (`gh api repos/:o/:r/check-runs/:id/annotations`). Before this, the only annotation a
      # failure produced was the runner's own "Process completed with exit code 100" — which
      # says a test failed and nothing about which, so a job that does not reproduce locally
      # was undiagnosable without admin. The artifact below covers the same gap; this is the
      # cheaper half, since it needs no download and shows on the run page.
      #
      # nextest marks failures as `        FAIL [   1.234s] binary case_name`, and a suite
      # wrapper prints its own inner failures as `    tests/foo_test.blsp:12: test failed: …`.
      # Emit both, deduplicated, capped so a mass failure cannot bury the summary.
      - name: Annotate the failing cases (on failure)
        if: failure() && steps.tw.outcome == 'failure'
        shell: bash
        run: |
          if [ ! -f tree-walker-nextest.log ]; then
            echo "::error::tree-walker: no nextest log — the step failed before running tests"
            exit 0
          fi
          grep -hoE '^[[:space:]]*(TRY [0-9]+ )?FAIL \[[^]]*\] .*' tree-walker-nextest.log \
            | sed 's/^[[:space:]]*//' | sort -u | head -25 \
            | while IFS= read -r line; do echo "::error::tree-walker nextest: $line"; done
          # `(:[0-9]+)?` for the column: the harness reports some failures as `file:line:col:`
          # and others as `file:line:`. Tested against a real two-failure log — without the
          # optional column this missed `registry_test.blsp:55:9` and annotated only half the
          # failures, which is worse than annotating none.
          grep -hoE 'tests/[A-Za-z0-9_./-]+\.blsp:[0-9]+(:[0-9]+)?: test failed: .*' tree-walker-nextest.log \
            | sort -u | head -25 \
            | while IFS= read -r line; do echo "::error::tree-walker in-language: $line"; done
          # A summary line regardless, so the annotation set is never empty on a failure.
          grep -hoE 'Summary \[[^]]*\].*' tree-walker-nextest.log | tail -1 \
            | while IFS= read -r line; do echo "::error::tree-walker $line"; done

      - name: Upload the tree-walker log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tree-walker-nextest-log
          path: tree-walker-nextest.log
          retention-days: 14
