name: CI

# Mirrors the local pre-commit gate (`make check`, plus `make fmt --check`):
#   fmt --check  →  clippy (all targets + all features, warnings fatal)  →  tests.
# Kept in lockstep with the Makefile so "green locally" and "green in CI" mean the
# same thing. `--all-features` builds the gui/audio/jit/treesit surface, which needs
# the system dev libraries installed in the build-test job below.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# What is NOT here: the tree-walker differential (the whole suite through BROOD_TIER=0, ~40
# minutes, ADR-076), the repeat runs, GC stress, the soaks and the sanitizers. They run in
# full.yml once a week and on dispatch. Per push this workflow is bounded by its longest job
# (`test`, the suite split over two runners); with the differential here it was ~40 minutes before anything said
# green.

# One in-flight run per ref. On a branch a new push cancels the run in flight: only the newest
# commit matters there. On main it does not: several sessions push to main minutes apart, and
# cancelling meant runs rarely finished — of the last 40 runs on 2026-10-25, 35 were cancelled,
# so whether main was green was mostly unknown. Now the run in flight finishes, and at most ONE waits,
# newer pushes replacing it, so each finished run covers a commit no older than one run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The bedit commit the `downstream-bedit` job checks out. PINNED, not `main`, so a red
  # run there is attributable to THIS brood commit and never to bedit's own breakage
  # landing under us. To bump: `git -C ../bedit rev-parse HEAD` (or
  # `gh api repos/broodlang/bedit/commits/main -q .sha`), paste it here, and run
  # `make smoke-bedit` against that checkout first — bump it whenever bedit adopts a
  # brood change (a rename wave, a new std name) that its previous commit predates.
  BEDIT_REF: c4d55b1cad1485031e78daed2404e87a4e2d716c

jobs:
  # Is the version in Cargo.toml actually released? Not a gate — a NOTICE, because the
  # commit that bumps the version legitimately precedes the tag. It exists because the
  # drift is otherwise silent and lasted days: 0.12.0 and 0.13.0 were bumped, changelogged
  # and committed as `release: …`, and never tagged, so the newest downloadable brood
  # stayed 0.11.0 while every package in the ecosystem advertised a floor above it —
  # a version nobody could install.
  release-status:
    name: is this version released?
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Compare Cargo.toml against the tags
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "v$version is tagged"
          else
            echo "::notice title=Unreleased version::Cargo.toml is $version and there is no \
          v$version tag. Packages resolving a ':brood' floor of >= $version would name a \
          version nobody can download. Tag it when the release is ready: git tag v$version \
          && git push origin v$version"
          fi

  # Formatting is a cheap, dependency-free gate — it needs neither the system
  # libraries nor a compiled build, so it runs on its own and fails fast.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      # Brood is described in its own terms; the script says what is allowed and why.
      - name: No other runtime named in a forward-facing file
        run: scripts/banned-names.sh

  # `rust-version` in Cargo.toml is a claim; this job is what makes it true. Every other
  # job tracks `stable`, so a newly-stabilised API used anywhere would raise the real floor
  # with nothing saying so (it happened once: `isolate_lowest_one`, see Cargo.toml). The
  # toolchain is read from Cargo.toml, so a deliberate bump there moves this job with it.
  msrv:
    name: builds on the declared minimum Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo check --workspace --all-targets

  # RustSec advisories, licenses and sources against Cargo.lock (deny.toml says what passes).
  # A new advisory against a crate already locked turns this red with no change here — that
  # is the point: it is the only job that learns about a dependency going bad.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # wasm32 is the ONE target nothing else here builds, and it is not a nice-to-have: the
  # in-browser playground (`crates/playground`) is a workspace member whose only real
  # target this is, and hive compiles it during every deploy to serve brood.fly.dev — the
  # reference page is introspected from that runtime and the playground RUNS it, so the
  # site cannot document and execute different languages.
  #
  # Added 2026-08-31, after `%gui-compiled?` shipped in 2dc7d2e6 with no `terminal_wasm.rs`
  # shim beside it. `cargo build`, `cargo clippy --all-features` and the whole suite were
  # green the entire time, because none of them ever names this target: the wasm build has
  # its OWN cfg surface (`#[cfg(target_arch = "wasm32")] #[path = "terminal_wasm.rs"]`),
  # and a host-target build cannot see a hole in it. It went unnoticed for a release and
  # surfaced as a failed Fly deploy — `error[E0425]: cannot find value gui_compiled_p` —
  # which is the worst place to learn it, since a deploy is where nobody is reading a
  # compiler.
  #
  # It used to be build-only, on the reasoning that what breaks in this class is COMPILATION
  # of the cfg'd surface. That is true of a cfg'd SHIM and false of the cooperative
  # scheduler, which is a whole alternate implementation whose bugs are behavioural — the
  # clock-domain hang needed a by-hand repro script to find precisely because it compiles
  # fine. There is a wasm test runner here now (`wasm-bindgen --target nodejs` + node), and
  # the behavioural suite runs after the build.
  wasm:
    name: wasm32 (the playground target — built AND run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # `--profile release-wasm`, matching hive's Dockerfile: CI must compile the wasm the
      # site actually ships, not a differently-optimized one.
      - run: cargo build --profile release-wasm --target wasm32-unknown-unknown -p brood-playground

      # Build-only was the standing state, and the comment above said so: "there is no wasm
      # test runner here". That left an entire alternate scheduler — the cooperative pump,
      # the non-blocking park, the frozen logical clock and `fire_next_timer` — compiled on
      # every run and executed on none. The native suite CANNOT cover it: off wasm there are
      # OS worker threads and `sched_now()` IS `Instant::now()`, so every gate agrees whether
      # or not the wasm path works, which is why the clock-domain bug needed a by-hand repro
      # script to find. `wasm-bindgen --target nodejs` + node is the runner; it needs nothing
      # a browser would.
      #
      # Sabotage-verified when it landed: a park gate on real time HANGS the suite, a pump
      # that sweeps one queue reds 7 of 10 cases, and a `fire_next_timer` that does not
      # advance the logical clock hangs. A hang is reported as its own verdict, because that
      # is this scheduler's signature failure and a bare non-zero exit would hide it.
      - name: wasm-bindgen CLI (pinned to the crate version in crates/playground)
        run: cargo install wasm-bindgen-cli --locked --version "$(sed -n 's/^wasm-bindgen = "=\(.*\)"/\1/p' crates/playground/Cargo.toml)"
      - name: wasm32 behavioural suite (the cooperative scheduler actually runs)
        run: ./scripts/wasm-suite.sh

  # Clippy runs ALONE, in parallel with the test job: its output cannot feed a real build, so
  # sharing a job only serialised it. Full --all-features coverage. See docs/build-and-ci.md.
  lint:
    name: clippy (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: scripts/ci/install-gui-deps.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # `cache-on-failure`: save the cache even when the job goes red. Default is false, and
      # that default cost real time on 2026-08-27: a red or cancelled run saved nothing, so
      # the next run started cold, and with several pushes in a row the cache was never once
      # written — CI looked cached and rebuilt from scratch every time. Cargo revalidates
      # fingerprints on restore, so a cache written by a failing build is not a stale-artifact
      # risk; the worst case is it holds objects the next run rebuilds anyway.
      #
      # Budget note: a repo gets 10 GB and GitHub evicts LRU past it. These five CI caches are
      # ~3.5 GB total, which fits — but only since the Release workflow was made restore-only
      # (`save-if: false` there); its four cross-compile targets had grown to ~7 GB and were
      # evicting these. If cold builds reappear, check `gh api .../actions/cache/usage` first.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # Same invocation as `make clippy`: all targets, all features, warnings fatal.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      # `--all-features` is a superset, and dead-code lints only go one way: a field only
      # `gui-gpu` reads is dead in a `gui` build without it — the feature set a configured
      # `make release` builds (`EmitterStep::present` warned there, 2026-10-21, while this
      # job was green). Same as `make clippy`'s second line.
      - name: Clippy (gui without gui-gpu)
        run: cargo clippy -p brood --lib --features gui -- -D warnings

      # Lives HERE for LOAD BALANCING, not for artifact reuse — an earlier version of this
      # comment claimed reuse and was simply wrong. `cargo clippy` runs `clippy-driver`, and
      # its outputs are not reusable by a real build, so a test step placed after clippy
      # recompiles from scratch **no matter what features it names**. Verified directly:
      # with the feature set matched exactly to `--all-features`, the very next
      # `cargo test` still printed `Compiling …` for the whole graph.
      #
      # Given that no placement can share, the only question is which job absorbs the cost.
      # This job is the short one (~143 s of clippy) and the test job is the long one
      # (~600 s), and jobs run in parallel — so the gui build lands in the slack here and
      # costs zero wall clock, where in the test job it would add to the critical path.
      # Features stay NARROW (`gui,gui-gpu`) for the same reason: with sharing impossible,
      # `--all-features` would only build more (audio, system-alloc, loom-model) for nothing.
      - name: Test (gui renderer — feature-gated, not covered by the nextest run)
        run: cargo test -p brood --features gui,gui-gpu --lib gui

  # Every other job here is ubuntu-latest, so until 2026-09-10 NOTHING compiled this tree
  # for macOS except the Release workflow's build matrix — which runs on a pushed TAG, after
  # the version is public. A `libc::ioctl(0, libc::TIOCSCTTY, 0)` added on 2026-09-03 took
  # `c_uint` on Apple and `c_ulong` on Linux; it compiled green here for a week and reddened
  # both mac arms of v0.27.1's release (KI-124). The two releases before that died at the
  # version gate BEFORE reaching a build, so not one of them could have caught it either.
  #
  # `check`, not `build`: this job exists to catch a compile error on a target no other job
  # compiles, not to produce a binary — the Release workflow still does that.
  # aarch64 only: both mac arms failed identically on the bug that motivated this, and the
  # Intel binary is cross-compiled from the same SDK on the same runner, so a second full
  # check buys little for the wall clock it costs.
  #
  # NO `--all-targets`, EITHER — but the reason has SHRUNK to one, so read this before
  # assuming it still cannot be turned on. What reddened the job when it was written was
  # `crates/cli/tests/support/mod.rs` reaping children with `libc::prctl(PR_SET_PDEATHSIG)`,
  # which does not exist in Apple's libc while sitting under a `cfg(unix)` wide enough to
  # include it. That is FIXED (2026-09-11): the one line is `cfg(target_os = "linux")` now,
  # the `getppid` orphan check beside it is portable and still runs, and a sweep of the test
  # trees found nothing else — `child_cleanup.rs` and the `/proc` helpers were already
  # file-level gated, and the remaining libc symbols there (`_exit`, `getppid`, `pid_t`,
  # `SIGKILL`, `waitpid`) are POSIX.
  #
  # So what is left is a judgement, not an obstacle: a release builds binaries, not tests,
  # and this job exists to protect the release. Compiling the whole test tree and its
  # dev-dependencies on a macOS runner buys coverage of code no gate ever runs off Linux.
  # Turn it on if that changes; it should pass.
  #
  # The feature note below began as the other half of the same mistake — every bit of extra
  # breadth this job was given turned up something that does not compile for macOS — and it
  # is worth recording that BOTH halves ended up resolved the same way: by fixing the code
  # the breadth exposed, not by narrowing the job further. The gui is now checked here.
  #
  # The feature set is the release's, PLUS `gui` — which is deliberate and worth explaining,
  # because it is broader than what a release builds. The Makefile defaults `WITH_GUI ?= 0`
  # and the `config.mk` that turns it on is written by ./configure and gitignored, so a
  # developer's local `make release` has the GUI and CI's release build does not. That
  # asymmetry is exactly how `brood/gui` came to contain Wayland-only winit calls that had
  # never once been compiled for macOS (KI-125). So the gui is checked here on purpose: it
  # is the configuration a developer on a Mac actually builds, and the one with no other
  # coverage anywhere. `audio` stays out — it is not implicated and costs build time.
  #
  # Since 2026-11-04 it also RUNS: a `nest` built here with the gui runs the platform smoke
  # set (scripts/ci/platform-smoke.sh — paths, files with CRLF / BOM / spaces, os/cmd and
  # os/spawn, the pty, the clipboard with no display, display width), and the gui's key
  # translation unit tests run here, where Option is a key of its own (ADR-541's
  # Option-as-Meta). A compile proves the code exists; this proves it does what the Linux
  # run says it does on the OS bedit's "avoided by design" claims are about.
  macos-check:
    name: macOS compiles and runs the platform smoke set
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: cargo check — brood + cli (the release feature set; see the note above)
        run: >
          cargo check -p cli --no-default-features
          --features brood/treesit-grammars --features brood/jit --features brood/stdimage
      - name: cargo check — brood-lsp
        run: cargo check -p brood-lsp
      # The gui backend (KI-125) is compiled by this build, so it needs no check of its own.
      - name: cargo build — nest with the gui
        run: cargo build -p nest --features brood/gui --features brood/treesit-grammars
      - name: platform smoke set (nest test, headless)
        run: scripts/ci/platform-smoke.sh target/debug/nest
      - name: gui key translation unit tests (Option-as-Meta, ADR-541)
        run: cargo test -p brood --features gui --lib host::gui::backend::input

  # Windows: the third desktop the runtime is meant for (the GPU target is wgpu so that DX12
  # draws what Vulkan and Metal do), and until 2026-10-18 no job compiled the tree for it.
  # A cross-check from Linux (`cargo check --target x86_64-pc-windows-gnu --all-targets`,
  # build scripts' C stubbed out) found the library already compiling and only test code
  # reaching for Unix sockets and modes; those now run over loopback TCP or gate on `unix`.
  #
  # `--all-targets` from the start, unlike macOS above: the tests are where the Unix
  # assumptions were, and they compile clean. The feature set is the release's plus the GPU
  # GUI and audio — what a game built with b2d ships with on this platform.
  windows-check:
    name: Windows compiles
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: cargo check — the workspace, every target, with the GPU gui and audio
        run: >
          cargo check --workspace --exclude brood-tab --exclude brood-playground --all-targets
          --features brood/gui-gpu --features brood/audio --features brood/treesit-grammars

  # Whether the runtime RUNS on Windows: build `brood` and run a program that spawns, sends,
  # receives and requires a std module, then a gui `nest` running the platform smoke set.
  # A gate since 2026-11-04 (it was `continue-on-error` while the port was new): the probe
  # had passed, and the smoke set's first run found only a test race (clipboard reads).
  windows-smoke:
    name: Windows runs a program and the platform smoke set
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: cargo build — brood
        run: cargo build -p cli
      - name: brood runs a program
        shell: bash
        run: |
          cat > smoke.blsp <<'BLSP'
          (let (me (self)
                child (spawn (fn () (receive ([:ping from] (send from [:pong (+ 1 2)]))))))
            (send child [:ping me])
            (receive ([:pong n] (io/puts (str "pong " n)))))
          (io/puts (json/encode {:ok true}))
          BLSP
          out=$(target/debug/brood smoke.blsp)
          echo "$out"
          test "$out" = "$(printf 'pong 3\n{"ok":true}')"
      # The same platform smoke set macOS runs, Windows's half of it: the portable files
      # (tests/platform_test.blsp in place of the POSIX-userland ones; the script says
      # which and why). Built with the CPU gui, as macOS is: the clipboard is the gui's.
      - name: cargo build — nest with the gui
        run: cargo build -p nest --features brood/gui --features brood/treesit-grammars
      - name: platform smoke set (nest test, headless)
        shell: bash
        run: scripts/ci/platform-smoke.sh target/debug/nest.exe
      - name: gui key translation unit tests (AltGr is Ctrl+Alt here, ADR-541)
        run: cargo test -p brood --features gui --lib host::gui::backend::input
      - name: ConPTY command-line quoting unit tests (KI-369)
        run: cargo test -p brood --features gui --lib host::subprocess::conpty
      # file/replace on Windows (ADR-671): ReplaceFileW over an existing file, a new file, one
      # another program holds open (refused, left whole) or lets go of within the wait.
      - name: file/replace unit tests (ReplaceFileW, a file held open)
        run: cargo test -p brood --features gui --lib builtins::filesystem::windows_replace_tests
      - name: grammar vetting and the crash mark unit tests (ADR-672)
        run: cargo test -p brood --features gui --lib -- host::treesit::vet cli_support::fatal_signal

  build-test:
    name: test (${{ matrix.partition }}/2)
    runs-on: ubuntu-latest
    # The suite in two halves on two runners (nextest --partition count:K/2): run whole, it was
    # ~12-16 minutes and the longest job of every push. The cargo checks and the doctests run in
    # the first half only.
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    steps:
      # The gui and gui-gpu test build, its nextest log and the rust cache outgrew the runner's
      # free disk ("No space left on device", 2026-11-05) — as the tree-walker job did. The
      # preinstalled toolchains this job never uses are ~30 GB.
      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell
          df -h /
      - uses: actions/checkout@v7

      # System libraries for the --all-features surface: libasound2-dev for the
      # `audio` feature (rodio→cpal links libasound.so.2), and the windowing /
      # The GUI/audio system libraries, only for the all-features lint/test here.
      - name: Install system dependencies
        run: scripts/ci/install-gui-deps.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # PINNED, not the floating `@nextest` tag: a floating tool version is an unreviewed
      # dependency bump on every run (0.9.144's checksum failure redded CI before any test
      # ran). Bump deliberately, after it installs cleanly.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.150

      # The no-default-features build (no JIT, no dev-tools): keeps every
      # `#[cfg(feature = …)]` seam honest without a second full test run.
      # `-p brood`, not `--workspace`: `crates/nest` depends on `brood` with default
      # features, so workspace feature unification would turn them back on and hide
      # a lean-build break.
      - name: Check (no default features)
        if: matrix.partition == 1
        run: cargo check -p brood --no-default-features

      # The LEAN runtime feature set, isolated the way `make release-brood` builds it
      # (`-p cli`), so a dev-tools-gating slip fails here instead of at deploy time.
      - name: Check (lean runtime — isolated -p cli, matches release-brood)
        if: matrix.partition == 1
        run: cargo check -p cli --no-default-features --features brood/jit

      # Same as `make test`: nextest process-isolates each case (a green-process
      # stack overflow can SIGSEGV, so isolation keeps one bad case from taking the
      # whole run down) and the grammar tests need the vendored tree-sitter parsers.
      # Through `nextest-no-flakes.sh`: a test that passes only on its retry fails the job.
      - name: Test (nextest)
        run: scripts/nextest-no-flakes.sh --no-fail-fast --features brood/treesit-grammars --partition count:${{ matrix.partition }}/2

      # The `gui`/`gui-gpu` renderer tests do not run above: the nextest step builds
      # the DEFAULT surface plus grammars, and `gui` is opt-in, so every
      # `#[cfg(test)]` case under `src/host/gui.rs` / `src/host/gui/gpu.rs` was compiled by the
      # clippy step and executed by nothing. A guard that never runs is not a guard —
      # and these are exactly the cases that pin a GUI-thread panic, which no Brood
      # `try` can catch. The system deps this needs are already installed above.
      # nextest doesn't run doctests; run them separately so future ones are covered.
      # Aligned with the nextest step's features on purpose: `cargo test --doc` on the
      # DEFAULT set was a third distinct feature configuration in this job, so it rebuilt
      # the whole graph a third time to run a handful of doctests.
      - name: Doctests
        if: matrix.partition == 1
        run: cargo test --doc --features brood/treesit-grammars

  # The type-checker gates, in a job of their own so they run beside the suite instead of
  # after it: in `test` they added ~2 minutes to the longest job of every run.
  typecheck:
    name: type checker (nest check, plain and strict — zero warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # The advisory type checker's ONE hard reject, which is batch/CI-only by
      # design (ADR-123/124/125/126): the checker never gates the live image, so
      # nothing but a run like this one can hold `std/` + `tests/` at zero
      # warnings. `nest check` exits 1 on any warning. The repo root is not a
      # `nest` project (no Brood.toml), so the file-list form is the right one —
      # it loads the project image first, so cross-module and qualified names
      # still resolve. Deliberate lints opt out in-source with `check-allow`.
      #
      # Keep it at zero — a new warning here is either a real finding or a missing
      # justified opt-out.
      - name: Type-checker gate (nest check — zero warnings)
        shell: bash
        run: |
          shopt -s globstar nullglob
          cargo run -q -p nest --features brood/treesit-grammars -- \
            check std/**/*.blsp tests/**/*.blsp examples/**/*.blsp

      # The STRICT gate: a positively-known bound is read by inclusion, so `number` where
      # `int` is declared, or `nil | string` handed to a string function, is a warning.
      # Keep it at zero — a new strict warning is an undeclared function or a real
      # maybe-nil. A test that passes what a sig would not admit ON PURPOSE says so with
      # `(check-allow :type-mismatch …)`. Examples are in it since KI-370 (2026-11-12): its
      # one sighting was a true strict warning in an example no strict gate read.
      - name: Type-checker STRICT gate over std + tests + examples (nest check --strict — zero warnings)
        shell: bash
        run: |
          shopt -s globstar nullglob
          cargo run -q -p nest --features brood/treesit-grammars -- \
            check --strict std/**/*.blsp tests/**/*.blsp examples/**/*.blsp

  # `examples/`: the user-facing programs, which no gate ran until 2026-08-17 — and they had
  # rotted three separate ways by then. `examples/editor` had called a module that moved to a
  # sibling project 2.5 months earlier (KI-45); ADR-227's stdlib move left `life.blsp` needing
  # a `(:use …)`; and ADR-229's `require` removal stopped `webserver`/`hot-reload`/`editor`
  # loading at all. Each was source-compatible-looking and silent. Same story as the breakage
  # job below: a suite nothing runs is a suite that rots.
  #
  # It gates on `unbound symbol` diagnostics, not exit codes — servers run until killed,
  # `node_client` wants a peer and `font-zoom` wants `--features gui`, so their exit codes are
  # environment noise, while an unbound name never is. Cheap (~1 min), so it runs on PRs too.
  # Both directories that no other gate covers: `examples/` and the stress harnesses.
  # Named for what it asserts — code outside the test runners still loads — so a red run
  # here is not read as "the examples broke" when it was a stress harness.
  examples:
    name: examples + stress still run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # `nest` too: the example PROJECTS (examples/*/project.blsp) are checked with `nest test`.
      - name: Build brood + nest
        run: cargo build --release -p cli -p nest

      # `.blsp` formatting has NO CI gate — only rustfmt does, and it covers Rust. The
      # pre-push hook runs `nest format --check`, so a break is caught on ONE developer's
      # machine and nowhere else: four separate commits landed unformatted .blsp between
      # 2026-08-20 and 2026-08-21 (ADR-238's two files; codemod/package/workspace; four more;
      # then codemod/gen again), each green in CI and each blocking the next person's push.
      # This job already builds `nest`, so the gate costs one command.
      - name: Check .blsp formatting (nest format)
        run: ./target/release/nest format --check

      # STATIC pass over the same trees, and it is not redundant with the two RUN-based gates
      # below. Those execute the programs, so they only ever see a dead name on a path a run
      # actually takes; this resolves every name in the file. With both of them green on
      # 2026-08-27 this found 74 unresolvable names — 31 `rem`, 11 `quot`, the whole `table-*`
      # family in `stress/check_corpus/` — all of them rename rot on branches nothing had run.
      # Cheap (a few seconds) and it runs FIRST, so the fast, precise failure comes before the
      # slow one.
      - name: Check the corpora resolve (static)
        shell: bash
        run: make check-corpora

      - name: Check the examples
        shell: bash
        run: make check-examples 2>&1 | tee examples.log

      # The project's own checker gate, run WITH the prelude image on (KI-106). Every test
      # written for the image passed while a multi-file `nest check` lost every derived
      # multimethod mirror; the gate found it on its first run. Asserts the imaged boot.
      - name: Check under the prelude image (nest check, imaged boot asserted)
        if: always()
        shell: bash
        run: make check-imaged NEST=./target/release/nest

      # Same gate, one directory over: `stress/` and `scripts/fuzz/stress/` are outside
      # `make test`, `nest check`, the breakage suite and `check-examples`, so two rename
      # waves rotted eight of their files with nothing to notice (2026-08-20). ~25 s for all
      # 28 harnesses, so it gates every PR — which is the point: a rename should go red
      # BEFORE it merges, not one red build later. `if: always()` so an examples failure
      # doesn't hide a stress failure; the job still fails if either does.
      - name: Check the stress harnesses
        if: always()
        shell: bash
        run: make check-stress 2>&1 | tee stress.log

      - name: Annotate the failing stress harnesses (on failure)
        if: failure()
        shell: bash
        run: |
          if [ ! -f stress.log ]; then
            echo "::error::stress: no log — the step failed before running"
            exit 0
          fi
          grep -hoE '^  FAIL +.*' stress.log | sort -u | head -25 \
            | while IFS= read -r line; do echo "::error::stress:$line"; done || true

      - name: Annotate the failing examples (on failure)
        if: failure()
        shell: bash
        run: |
          if [ ! -f examples.log ]; then
            echo "::error::examples: no log — the step failed before running"
            exit 0
          fi
          grep -hoE '^  FAIL +.*' examples.log | sort -u | head -25 \
            | while IFS= read -r line; do echo "::error::examples:$line"; done || true

  # The in-language suite with every `sig` ARMED as a runtime contract (ADR-381) — what each
  # `nest test` and `nest run` user gets. The `test` job runs the same suite through its cargo
  # wrapper with contracts off, because armed it costs twice the CPU and that wrapper has a
  # five-minute local budget; so without this job a contract shim that breaks a caller, or a
  # test that only passes unarmed, went red for users and nowhere here. Its own job, in
  # parallel with `test`, so it adds no wall-clock to the per-push answer.
  contracts-armed:
    name: suite with contracts armed (nest test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build brood + nest
        run: cargo build --release -p cli -p nest

      # Also the per-push run of std's and the prelude's SOURCE load paths (KI-78): both images
      # are default-on, so without these every job would run imaged. The tree-walker job carried
      # this until it moved to the weekly full.yml.
      - name: nest test over the repo (BROOD_CONTRACTS=1, std loaded from source)
        env:
          BROOD_NO_STDIMAGE: 1
          BROOD_NO_PRELUDE_IMAGE: 1
        run: ./scripts/test-contracts.sh

  # DOWNSTREAM smoke: bedit (github.com/broodlang/bedit) against the brood under test.
  #
  # bedit is the largest program written in the language that does not live in this repo,
  # so it is where a brood regression surfaces FIRST — and until 2026-08-30 nowhere in this
  # workflow could see one. That day a half-landed rename wave (ADR-302: `gui/font!` →
  # `gui/font`, `os/clipboard-set!` → `os/clipboard-set`, …) shipped in an installed brood
  # while bedit still called the old names; `std/` + `tests/` were green because the broken
  # callers were in the other repository. bedit's own CI tracks brood `main` (package-ci.yml)
  # and so reports the break one repo over, after the fact, on a schedule nobody watches
  # from here.
  #
  # REQUIRED and FAILING, deliberately: a non-blocking job is a job nobody reads. What keeps
  # it fair is the pin — `BEDIT_REF` (top of file) fixes which bedit runs, so bedit's own
  # in-flight breakage cannot turn this red; only brood can. When bedit moves to adopt a
  # brood change, bump the pin in the SAME brood commit that lands the change.
  #
  # The build mirrors what `./configure --with-gui && make install` produces — bedit's
  # release workflow builds brood exactly that way, and it is the installed toolchain the
  # rename wave broke: `INSTALL_FEATURES` from the Makefile (lean base + gui +
  # treesit-grammars + jit + stdimage, PLUS dev-tools, which carries `nest test`). The
  # tree-sitter grammars are not optional here: bedit's ruby/elixir/markdown mode tests
  # need them and fail on a default build (8 of them, measured 2026-08-30). `gui` is what
  # needs the X11/Wayland/GL headers below; `--check-boot` and the suite run under
  # BROOD_GUI_HEADLESS=1 so no window is ever opened.
  #
  # Two checkouts side by side inside the workspace (`brood/`, `bedit/`) — actions/checkout
  # refuses a path outside it, and the sibling layout is what `make smoke-bedit` expects
  # locally (`../bedit`). The script is the single definition of the three gates:
  # `nest check` (zero warnings), `nest run --check-boot`, `nest test` (~28 s wall locally,
  # 1378 cases). Each runs under the address-space cap the script sets (CLAUDE.md, KI-87).
  downstream-bedit:
    name: downstream smoke (bedit @ BEDIT_REF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: brood
      - uses: actions/checkout@v7
        with:
          repository: broodlang/bedit
          ref: ${{ env.BEDIT_REF }}
          path: bedit

      # The GUI backend's system libraries (same script as the test job).
      - name: Install system dependencies
        run: brood/scripts/ci/install-gui-deps.sh

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: brood
          cache-on-failure: true

      # Build UNCAPPED (the linker dies under an address-space cap), run capped — the script
      # applies the cap. The feature set is the Makefile's `INSTALL_FEATURES`, asked of the
      # Makefile so it is spelled in one place (gui on; gpu and audio pinned off).
      - name: Build brood + nest (INSTALL_FEATURES — the `make install` toolchain, with gui)
        working-directory: brood
        run: |
          features=$(make -s WITH_GUI=1 WITH_GUI_GPU=0 WITH_AUDIO=0 install-features)
          echo "features: $features"
          cargo build --release -p cli -p nest $features

      - name: Smoke bedit (nest check, nest run --check-boot, nest test)
        working-directory: brood
        env:
          BEDIT_DIR: ${{ github.workspace }}/bedit
          NEST: ${{ github.workspace }}/brood/target/release/nest
        run: ./scripts/smoke-bedit.sh --require

  # The `breakage/` suite: deliberately abusive programs that try to make the JIT diverge
  # from the VM, overflow the eval stack, corrupt the heap or deadlock the scheduler. It is
  # NOT part of `make test` on purpose (slow, and abusive by design) — but that meant
  # *nothing ever ran it*, and a broken assertion sat green-adjacent for two months:
  # `jit_breakage_test.blsp` asserted `(assert= 4.8 (/ 24 5))`, which brood's
  # exactness-sensitive `=` has never accepted since exact rationals landed. It failed on
  # every build and no one saw it, because there was no runner (found 2026-08-13).
  #
  # Main pushes and manual dispatch, not every PR. Move it to full.yml if it starts costing
  # more than it catches (it runs beside `test` in ~3 minutes, so it does not lengthen a run).
  breakage:
    name: breakage suite (JIT + GC tripwire armed)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # `make breakagetests` builds `--release` with `-C debug-assertions=on`, so the
      # per-deref GC tripwire and heap verifier stay armed: a use-after-GC aborts at the bad
      # deref instead of surfacing as a distant SIGSEGV. Default features only (the JIT is
      # one), so no gui/audio system deps are needed.
      - name: Run the breakage suite
        shell: bash
        run: make breakagetests 2>&1 | tee breakage.log

      # KI-57: a handle held across a collection is only caught when a collection happens
      # to land inside the window, and every job above collects on a THRESHOLD — including
      # the breakage suite right here, whose tripwire is armed but whose collections are
      # incidental. So a stale `tags` handle in the selective-receive scan survived every
      # green run in the repo's history until someone ran GC stress by hand.
      #
      # `make gcstress` collects at every safepoint over the process/mailbox-heavy tests,
      # which is where this class lives. It is a DEBUG build on purpose: `--release` with
      # debug-assertions — what the step above uses — reports KI-57 clean, verified against
      # the faithful pre-fix code. Takes well under a minute.
      - name: GC stress (use-after-GC hunt over the process/mailbox tests)
        shell: bash
        run: make gcstress

      - name: Annotate the failing files (on failure)
        if: failure()
        shell: bash
        run: |
          if [ ! -f breakage.log ]; then
            echo "::error::breakage: no log — the step failed before running"
            exit 0
          fi
          grep -hoE '^>>> (FAIL|CRASH) \(.*' breakage.log | sort -u | head -25 \
            | while IFS= read -r line; do echo "::error::breakage: $line"; done || true
          grep -hoE '^breakage/[A-Za-z0-9_./-]+\.blsp:[0-9]+(:[0-9]+)?: test failed: .*' breakage.log \
            | sort -u | head -25 \
            | while IFS= read -r line; do echo "::error::breakage: $line"; done || true

      - name: Upload the breakage log (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: breakage-log
          path: breakage.log
          retention-days: 14

  # `last-green`: a branch at the newest main commit whose run passed every job — what a
  # package's CI builds against (bedit: `brood-ref: last-green` and its BROOD_REF), so a main
  # that does not build reddens brood and no package, while a package still tracks main within
  # one green run. It only moves forward: a slower run of an older commit leaves it alone.
  last-green:
    name: advance last-green
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [fmt, msrv, deny, wasm, lint, macos-check, windows-check, windows-smoke, build-test, typecheck, examples, contracts-armed, downstream-bedit, breakage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Move last-green to this commit
        shell: bash
        run: |
          if git fetch -q origin last-green 2>/dev/null \
              && ! git merge-base --is-ancestor FETCH_HEAD "$GITHUB_SHA"; then
            echo "last-green is already past this commit; left where it is"
            exit 0
          fi
          git push --force origin "$GITHUB_SHA:refs/heads/last-green"
