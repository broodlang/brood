name: CI

# Mirrors the local pre-commit gate (`make check`, plus `make fmt --check`):
#   fmt --check  →  clippy (all targets + all features, warnings fatal)  →  tests.
# Kept in lockstep with the Makefile so "green locally" and "green in CI" mean the
# same thing. `--all-features` builds the gui/audio/jit/treesit surface, which needs
# the system dev libraries installed in the build-test job below.

on:
  push:
    branches: [main]
  pull_request:
  # So the expensive tree-walker differential job (below, main-push only) can be
  # run on demand against a branch before merging.
  workflow_dispatch:

# One in-flight run per ref; a new push cancels the previous run for that ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Formatting is a cheap, dependency-free gate — it needs neither the system
  # libraries nor a compiled build, so it runs on its own and fails fast.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Lint + test together: both need the full --all-features build (gui/audio/jit/
  # treesit), so they share the one toolchain, system-dep install, and cache.
  build-test:
    name: clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # System libraries for the --all-features surface: libasound2-dev for the
      # `audio` feature (rodio→cpal links libasound.so.2), and the windowing /
      # GL / clipboard stack for `gui`/`gui-gpu` (winit, softbuffer, glutin+glow,
      # arboard — X11 + Wayland + xkbcommon + OpenGL). A default build needs none
      # of these; they're only for the all-features lint/test here.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # Same invocation as `make clippy`: all targets, all features, warnings fatal.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The no-JIT configuration (`BROOD_NO_JIT` has a build-level counterpart —
      # CLAUDE.md documents `--no-default-features` as supported). It broke silently
      # once (ungated `crate::jit` refs, found 2026-07-19); this check keeps every
      # `#[cfg(feature = "jit")]` seam honest without a second full test run.
      # NOTE the `-p brood`, not `--workspace`. `--workspace --no-default-features`
      # CANNOT see a lean-build break: `crates/nest` depends on `brood` WITHOUT
      # `default-features = false`, so Cargo's feature unification turns `dev-tools`
      # (and friends) back on for the shared `brood` build and the check passes.
      # Demonstrated 2026-08-20 — an ungated `gc_stats` calling a dev-tools-gated
      # `gc_stats_map` gave `--workspace` exit 0 and `-p brood` exit 101, and the break
      # reached a developer's `make install` instead of CI. That is the second time this
      # configuration broke silently (the first, ungated `crate::jit` refs on 2026-07-19,
      # is what this step was added for — so the guard has never actually worked).
      - name: Check (no default features)
        run: cargo check -p brood --no-default-features

      # Same as `make test`: nextest process-isolates each case (a green-process
      # stack overflow can SIGSEGV, so isolation keeps one bad case from taking the
      # whole run down) and the grammar tests need the vendored tree-sitter parsers.
      - name: Test (nextest)
        run: cargo nextest run --no-fail-fast --features brood/treesit-grammars

      # nextest doesn't run doctests; run them separately so future ones are covered.
      - name: Doctests
        run: cargo test --doc

      # The advisory type checker's ONE hard reject, which is batch/CI-only by
      # design (ADR-123/124/125/126): the checker never gates the live image, so
      # nothing but a run like this one can hold `std/` + `tests/` at zero
      # warnings. `nest check` exits 1 on any warning. The repo root is not a
      # `nest` project (no Brood.toml), so the file-list form is the right one —
      # it loads the project image first, so cross-module and qualified names
      # still resolve. Deliberate lints opt out in-source with `check-allow`.
      #
      # Reached zero 2026-07-31 (was 81 on 2026-07-25): every deliberate
      # non-tail recursion in std/ + tests/ now carries a justified
      # `(check-allow :non-tail-recursion …)`, the bootstrap `append--2` became
      # tail-recursive, and `gui-open`'s Sig admits its nil-able optionals. Keep
      # it at zero — a new warning here is either a real finding or a missing
      # justified opt-out.
      - name: Type-checker gate (nest check — zero warnings)
        shell: bash
        run: |
          shopt -s globstar nullglob
          cargo run -q -p nest --features brood/treesit-grammars -- \
            check std/**/*.blsp tests/**/*.blsp

  # The ADR-076 differential gate — the whole suite through the tree-walker
  # escape hatch (`BROOD_VM=0`), the second half of `make test-both`. The VM is
  # the default engine and `differential.rs` already checks per-expression
  # agreement inside the normal run, so this is the belt-and-braces pass that
  # catches a divergence only a full tree-walked suite would show.
  #
  # The tree-walker is ~10x slower than the VM (CLAUDE.md), so this would roughly
  # triple PR latency for a rarely-firing gate. It runs on main pushes and on
  # manual dispatch instead — the same trade-off that keeps `test-both` out of
  # the local `make check`.
  tree-walker:
    name: differential (tree-walker)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # No --all-features here: this job only needs the default surface (the
      # engine under test), so it skips the gui/audio system-dep install above.
      #
      # Output is tee'd so the step below can upload it. Reading a run's LOG needs admin on
      # the repository (`/actions/runs/:id/logs` → 403 otherwise), which means a failure here
      # is undiagnosable to anyone without it — and this job fails in ways that do not
      # reproduce locally, so "read the log" is exactly what one needs to do. An artifact is
      # downloadable with plain read access (`gh run download`), so the failing case travels
      # out of CI regardless of permissions. `pipefail` keeps the tee from masking the exit
      # code.
      # `--failure-output immediate-final` repeats every failure in one block at the end, which
      # is what makes the parse below a parse rather than a guess.
      - name: Test (nextest, BROOD_VM=0)
        id: tw
        env:
          BROOD_VM: 0
        shell: bash
        run: |
          set -o pipefail
          # `--color never`: nextest colours its output under CI even into a pipe, and every
          # pattern the annotate step below greps for anchors on `WORD [` — which a coloured log
          # writes as `WORD<ESC>[0m [`. That mismatch is why KI-39 went three sightings without
          # ever naming a case. The step also strips ANSI defensively; this makes it moot.
          cargo nextest run --no-fail-fast --failure-output immediate-final --color never 2>&1 \
            | tee tree-walker-nextest.log

      # Name the failing cases as workflow ERROR commands, which GitHub turns into check-run
      # ANNOTATIONS. This exists because of a permissions asymmetry that cost real time on
      # KI-39: a run's *log* needs admin on the repository (`/actions/runs/:id/logs` → 403,
      # `rerun-failed-jobs` → 401), but annotations are readable with plain read access
      # (`gh api repos/:o/:r/check-runs/:id/annotations`). Before this, the only annotation a
      # failure produced was the runner's own "Process completed with exit code 100" — which
      # says a test failed and nothing about which, so a job that does not reproduce locally
      # was undiagnosable without admin. The artifact below covers the same gap; this is the
      # cheaper half, since it needs no download and shows on the run page.
      #
      # nextest marks failures as `        FAIL [   1.234s] binary case_name`, and a suite
      # wrapper prints its own inner failures as `    tests/foo_test.blsp:12: test failed: …`.
      # Emit both, deduplicated, capped so a mass failure cannot bury the summary.
      - name: Annotate the failing cases (on failure)
        if: failure() && steps.tw.outcome == 'failure'
        shell: bash
        run: |
          if [ ! -f tree-walker-nextest.log ]; then
            echo "::error::tree-walker: no nextest log — the step failed before running tests"
            exit 0
          fi

          # Grep a de-ANSI'd COPY, never the raw log. nextest colours under CI, so the raw log
          # holds `Summary<ESC>[0m [1922.084s]` and a `Summary \[` pattern cannot match it — the
          # exact reason this step reported nothing for three KI-39 sightings while the run page
          # showed a green annotate step. `--color never` above prevents it at the source; this
          # keeps the step correct even if that regresses or a tool colours anyway.
          sed -E $'s/\x1b\\[[0-9;]*[A-Za-z]//g' tree-walker-nextest.log > tree-walker-plain.log

          # A case can end in more ways than FAIL: `TIMEOUT [ 300.010s]` is how the run of
          # 2026-08-17 actually failed, and it matched none of the original three patterns.
          grep -hoE '^[[:space:]]*(TRY [0-9]+ )?(FAIL|TIMEOUT|SIGSEGV|SIGABRT|ABORT|LEAK) \[[^]]*\] .*' tree-walker-plain.log \
            | sed 's/^[[:space:]]*//' | sort -u | head -25 \
            | while IFS= read -r line; do echo "::error::tree-walker nextest: $line"; done || true
          # `(:[0-9]+)?` for the column: the harness reports some failures as `file:line:col:`
          # and others as `file:line:`. Tested against a real two-failure log — without the
          # optional column this missed `registry_test.blsp:55:9` and annotated only half the
          # failures, which is worse than annotating none.
          grep -hoE 'tests/[A-Za-z0-9_./-]+\.blsp:[0-9]+(:[0-9]+)?: test failed: .*' tree-walker-plain.log \
            | sort -u | head -25 \
            | while IFS= read -r line; do echo "::error::tree-walker in-language: $line"; done || true
          # A summary line regardless, so the annotation set is never empty on a failure.
          grep -hoE 'Summary \[[^]]*\].*' tree-walker-plain.log | tail -1 \
            | while IFS= read -r line; do echo "::error::tree-walker $line"; done || true

          # UNCONDITIONAL FALLBACK. Run 32054863012 (2026-08-17) proved the greps are not enough
          # on their own: the step ran and SUCCEEDED (the `|| true` fix works) yet emitted no
          # annotation at all — not even the Summary line, which nextest always prints. The cause
          # was the ANSI mismatch fixed above, found only by finally downloading the artifact.
          #
          # A diagnostic that reports nothing when its patterns miss is the failure mode this
          # whole step exists to avoid (KI-39 lost three sightings to exactly that). So: if
          # nothing above matched, annotate the log's tail verbatim. Ugly, bounded, never silent.
          if ! grep -qE '(FAIL \[|TIMEOUT \[|test failed:|Summary \[)' tree-walker-plain.log; then
            echo "::error::tree-walker: none of the failure patterns matched this log — dumping its tail"
            tail -30 tree-walker-plain.log \
              | while IFS= read -r line; do
                  [ -n "$line" ] && echo "::error::tree-walker raw: $line"
                done || true
            echo "::error::tree-walker: log is $(wc -l < tree-walker-plain.log) lines, $(wc -c < tree-walker-plain.log) bytes"
          fi

      - name: Upload the tree-walker log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tree-walker-nextest-log
          path: tree-walker-nextest.log
          retention-days: 14

  # `examples/`: the user-facing programs, which no gate ran until 2026-08-17 — and they had
  # rotted three separate ways by then. `examples/editor` had called a module that moved to a
  # sibling project 2.5 months earlier (KI-45); ADR-227's stdlib move left `life.blsp` needing
  # a `(:use …)`; and ADR-229's `require` removal stopped `webserver`/`hot-reload`/`editor`
  # loading at all. Each was source-compatible-looking and silent. Same story as the breakage
  # job below: a suite nothing runs is a suite that rots.
  #
  # It gates on `unbound symbol` diagnostics, not exit codes — servers run until killed,
  # `node_client` wants a peer and `font-zoom` wants `--features gui`, so their exit codes are
  # environment noise, while an unbound name never is. Cheap (~1 min), so it runs on PRs too.
  # Both directories that no other gate covers: `examples/` and the stress harnesses.
  # Named for what it asserts — code outside the test runners still loads — so a red run
  # here is not read as "the examples broke" when it was a stress harness.
  examples:
    name: examples + stress still run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # `nest` too: the example PROJECTS (examples/*/project.blsp) are checked with `nest test`.
      - name: Build brood + nest
        run: cargo build --release -p cli -p nest

      - name: Check the examples
        shell: bash
        run: make check-examples 2>&1 | tee examples.log

      # Same gate, one directory over: `stress/` and `scripts/fuzz/stress/` are outside
      # `make test`, `nest check`, the breakage suite and `check-examples`, so two rename
      # waves rotted eight of their files with nothing to notice (2026-08-20). ~25 s for all
      # 28 harnesses, so it gates every PR — which is the point: a rename should go red
      # BEFORE it merges, not one red build later. `if: always()` so an examples failure
      # doesn't hide a stress failure; the job still fails if either does.
      - name: Check the stress harnesses
        if: always()
        shell: bash
        run: make check-stress 2>&1 | tee stress.log

      - name: Annotate the failing stress harnesses (on failure)
        if: failure()
        shell: bash
        run: |
          if [ ! -f stress.log ]; then
            echo "::error::stress: no log — the step failed before running"
            exit 0
          fi
          grep -hoE '^  FAIL +.*' stress.log | sort -u | head -25 \
            | while IFS= read -r line; do echo "::error::stress:$line"; done || true

      - name: Annotate the failing examples (on failure)
        if: failure()
        shell: bash
        run: |
          if [ ! -f examples.log ]; then
            echo "::error::examples: no log — the step failed before running"
            exit 0
          fi
          grep -hoE '^  FAIL +.*' examples.log | sort -u | head -25 \
            | while IFS= read -r line; do echo "::error::examples:$line"; done || true

  # The `breakage/` suite: deliberately abusive programs that try to make the JIT diverge
  # from the VM, overflow the eval stack, corrupt the heap or deadlock the scheduler. It is
  # NOT part of `make test` on purpose (slow, and abusive by design) — but that meant
  # *nothing ever ran it*, and a broken assertion sat green-adjacent for two months:
  # `jit_breakage_test.blsp` asserted `(assert= 4.8 (/ 24 5))`, which brood's
  # exactness-sensitive `=` has never accepted since exact rationals landed. It failed on
  # every build and no one saw it, because there was no runner (found 2026-08-13).
  #
  # Same guard as the tree-walker job: main pushes and manual dispatch, not every PR. Move it
  # to a `schedule:` if it starts costing more than it catches.
  breakage:
    name: breakage suite (JIT + GC tripwire armed)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # `make breakagetests` builds `--release` with `-C debug-assertions=on`, so the
      # per-deref GC tripwire and heap verifier stay armed: a use-after-GC aborts at the bad
      # deref instead of surfacing as a distant SIGSEGV. Default features only (the JIT is
      # one), so no gui/audio system deps are needed.
      - name: Run the breakage suite
        shell: bash
        run: make breakagetests 2>&1 | tee breakage.log

      - name: Annotate the failing files (on failure)
        if: failure()
        shell: bash
        run: |
          if [ ! -f breakage.log ]; then
            echo "::error::breakage: no log — the step failed before running"
            exit 0
          fi
          grep -hoE '^>>> (FAIL|CRASH) \(.*' breakage.log | sort -u | head -25 \
            | while IFS= read -r line; do echo "::error::breakage: $line"; done || true
          grep -hoE '^breakage/[A-Za-z0-9_./-]+\.blsp:[0-9]+(:[0-9]+)?: test failed: .*' breakage.log \
            | sort -u | head -25 \
            | while IFS= read -r line; do echo "::error::breakage: $line"; done || true

      - name: Upload the breakage log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: breakage-log
          path: breakage.log
          retention-days: 14
