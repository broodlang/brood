name: Diagnose

# Timing questions the development desktop must not answer (no benchmarks or timing runs
# there): run on demand, never on a push. `what` picks the job.
#
# `ki307` (the default) answers KI-307 — does a process with a large live heap stall the
# processes beside it, and through what — by running `scripts/gc-contention-repro.blsp`
# under variants that each rule a shared resource in or out — the allocator (mimalloc v3 as
# shipped, v2, purging off, the system allocator) — and with a `perf` profile of the stalled
# foreground, kernel symbols included.
#
# `ki308` runs the repro's regex-split scenario three times with `BROOD_STALL_MS=20` (each long
# pause the runtime instruments names itself), three times with `std/regex` loaded first, and
# the full sequence three times.
#
# `repeat` builds one integration-test binary and runs one test in it `times` times, one
# process each, with `BROOD_JIT_BAIL_TRACE=1`, and prints what every failing run traced: the
# way to look at an intermittent test (KI-309) without a loop on the desktop.
#
# `ab` runs `scripts/ab-bench.sh --floor` over the default benchmark rows, `base` against this
# commit. A shared runner is noisy, so it can show a large regression, not a few percent; the
# benchmark box (`make ab`) is still the gate for a small one (docs/benchmarking.md).
#
#     gh workflow run diagnose.yml -R broodlang/brood -f what=ab -f base=<ref>
#     (then `gh run watch` on the run it starts)

on:
  workflow_dispatch:
    inputs:
      what:
        description: "ki307 (the gc-contention repro), ab (benchmark rows, base vs this commit) ki308 (the regex-split stall), or repeat (one Rust test, many times)"
        default: ki307
      base:
        description: "for ab: the baseline ref"
        default: "HEAD^"
      binary:
        description: "for repeat: the integration-test binary under crates/lisp/tests (its file name, no .rs)"
        default: interrupt_one_worker
      test:
        description: "for repeat: the test name filter"
        default: a_native_walk_that_hosts_a_park_blocks_once_and_then_parks
      times:
        description: "for repeat: how many runs"
        default: "200"
      rows:
        description: "for ab: the benchmark rows (empty: the default set)"
        default: ""

concurrency:
  group: diagnose-${{ inputs.what }}
  cancel-in-progress: true

env:
  REPRO: scripts/gc-contention-repro.blsp

jobs:
  gc-contention:
    name: KI-307 — a big live heap beside an allocating process
    if: inputs.what == 'ki307'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Frame pointers and line tables for `perf -g`; neither changes what the optimizer does
      # with the code being timed beyond keeping the frame-pointer register.
      - name: Build (release, mimalloc — the shipped allocator)
        env:
          RUSTFLAGS: "-C force-frame-pointers=yes"
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        run: cargo build --release -p cli

      - name: Build (release, the system allocator)
        env:
          RUSTFLAGS: "-C force-frame-pointers=yes --cfg brood_system_alloc"
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        run: cargo build --release -p cli --target-dir target/system-alloc

      # mimalloc v3 is what the `mimalloc` crate builds by default; v2 is its other line. The
      # switch is made in this checkout only, so the shipped manifest keeps one allocator.
      - name: Build (release, mimalloc v2)
        env:
          RUSTFLAGS: "-C force-frame-pointers=yes"
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        run: |
          sed -i 's/^mimalloc = { version = "0.1", default-features = false }/mimalloc = { version = "0.1", default-features = false, features = ["v2"] }/' crates/lisp/Cargo.toml
          grep -n '^mimalloc' crates/lisp/Cargo.toml
          cargo build --release -p cli --target-dir target/mimalloc-v2
          git checkout -- crates/lisp/Cargo.toml Cargo.lock

      - name: Install perf; allow kernel profiling
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q linux-tools-common "linux-tools-$(uname -r)" || sudo apt-get install -y -q linux-tools-generic
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          nproc; free -m; uname -r

      # The full run aborted on the 16 GB address-space cap as the live-strings scenario began,
      # under mimalloc and the system allocator alike. Run that scenario on its own first, with
      # the kernel's memory figures printed around the background's kill.
      - name: The live-strings scenario alone (the abort)
        continue-on-error: true
        env:
          KI307_MODE: strings
          RUST_BACKTRACE: "1"
        run: ( ulimit -v 16000000; timeout 300 target/release/brood "$REPRO" )

      - name: Repro (mimalloc v3, the default)
        continue-on-error: true
        env:
          RUST_BACKTRACE: "1"
        run: ( ulimit -v 16000000; timeout 300 target/release/brood "$REPRO" )

      - name: Repro (mimalloc v2)
        continue-on-error: true
        env:
          RUST_BACKTRACE: "1"
        run: ( ulimit -v 16000000; timeout 300 target/mimalloc-v2/release/brood "$REPRO" )

      - name: Repro (mimalloc v3, purging off)
        continue-on-error: true
        env:
          MIMALLOC_PURGE_DELAY: "-1"
        run: ( ulimit -v 16000000; KI307_MODE=maps timeout 300 target/release/brood "$REPRO" )

      - name: Repro (the system allocator)
        continue-on-error: true
        run: ( ulimit -v 16000000; KI307_MODE=maps timeout 300 target/system-alloc/release/brood "$REPRO" )

      # The foreground is the root process, which runs on the main thread, so its thread id is
      # the process id: the per-thread report separates it from the background's worker.
      - name: Profile the live-maps scenario (perf record, kernel included)
        continue-on-error: true
        env:
          KI307_MODE: maps
        run: |
          ( ulimit -v 16000000; timeout 300 perf record -F 1999 -g -o target/ki307.perf \
              target/release/brood "$REPRO" )
          perf report -i target/ki307.perf --stdio --no-children --sort pid,tid --percent-limit 1 -g none \
              2>/dev/null | grep -v "^$" | head -20 | tee target/ki307-threads.txt
          main=$(perf script -i target/ki307.perf -F pid 2>/dev/null | head -1 | tr -d " ")
          echo "== the foreground (main thread $main)"
          perf report -i target/ki307.perf --stdio --no-children --tid "$main" --sort dso,sym \
              --percent-limit 0.5 -g none 2>/dev/null | grep -v "^$" | head -60 | tee target/ki307-foreground.txt
          echo "== the foreground, callers of its top symbols"
          perf report -i target/ki307.perf --stdio --no-children --tid "$main" --sort sym \
              --percent-limit 3 -g caller,0.5,callee --max-stack 12 2>/dev/null | grep -v "^$" | head -200 \
              | tee target/ki307-foreground-callers.txt
          echo "== everything, kernel only"
          perf report -i target/ki307.perf --stdio --no-children --sort sym \
              --dsos '[kernel.kallsyms]' --percent-limit 0.3 -g none 2>/dev/null | grep -v "^$" | head -60 \
              | tee target/ki307-kernel.txt

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ki307-reports
          path: target/ki307-*.txt
          if-no-files-found: warn

  ab:
    name: benchmark rows, base vs this commit
    if: inputs.what == 'ab'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: broodlang/brood-benchmarks
          path: brood-benchmarks
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: A/B the default rows
        env:
          BROOD_BENCH_DIR: ${{ github.workspace }}/brood-benchmarks
        run: |
          nproc
          base=$(git rev-parse "${{ inputs.base }}")
          echo "base $base, this commit $(git rev-parse HEAD)"
          scripts/ab-bench.sh -b "$base" --floor ${{ inputs.rows }}

  repeat:
    name: one test, run repeatedly
    if: inputs.what == 'repeat'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build the test binary
        run: cargo test -p brood --test "${{ inputs.binary }}" --no-run
      - name: Run it ${{ inputs.times }} times
        env:
          BROOD_JIT_BAIL_TRACE: "1"
        run: |
          binary=$(ls -t target/debug/deps/${{ inputs.binary }}-* | grep -v '\.d$' | head -1)
          echo "binary $binary, commit $(git rev-parse --short HEAD), $(nproc) cores"
          failures=0
          for round in $(seq 1 "${{ inputs.times }}"); do
            if ( ulimit -v 16000000; timeout 120 "$binary" "${{ inputs.test }}" --nocapture --test-threads=1 ) > target/round.log 2>&1; then
              if [ "$round" = 1 ]; then echo "== round 1 passed; its trace:"; grep -E "suspend-latched|dirty-receive-block|shared-arms-dropped" target/round.log | head -20; fi
            else
              failures=$((failures + 1))
              echo "== round $round FAILED; its trace:"
              grep -E "suspend-latched|dirty-receive-block|shared-arms-dropped|panicked|blocked more" target/round.log | head -30
            fi
          done
          echo "$failures of ${{ inputs.times }} rounds failed"
          [ "$failures" -eq 0 ]

  regex-stall:
    name: KI-308 — the regex-split stall, with the stall log
    if: inputs.what == 'ki308'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build (release)
        run: cargo build --release -p cli
      - name: The regex scenario, three times
        env:
          BROOD_STALL_MS: "20"
        run: |
          for round in 1 2 3; do
            echo "== round $round"
            ( ulimit -v 16000000; KI307_MODE=regex timeout 300 target/release/brood "$REPRO" ) 2>&1
          done
      - name: The regex scenario with std/regex loaded first, three times
        env:
          BROOD_STALL_MS: "20"
        run: |
          for round in 1 2 3; do
            echo "== round $round"
            ( ulimit -v 16000000; KI307_MODE=regex-preloaded timeout 300 target/release/brood "$REPRO" ) 2>&1
          done
      # The stall showed in the FULL sequence (Diagnose 41019562798, both allocator builds) and
      # not in six isolated runs, so it depends on what ran before.
      - name: The full sequence, three times
        env:
          BROOD_STALL_MS: "20"
        run: |
          for round in 1 2 3; do
            echo "== round $round"
            ( ulimit -v 16000000; timeout 300 target/release/brood "$REPRO" ) 2>&1 | grep -v "native %receive took 5[0-9]ms"
          done
