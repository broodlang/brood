name: Release

# Build the Brood toolchain (brood + nest + brood-lsp) for each supported platform
# and attach the tarballs to a GitHub Release. Triggered by pushing a version tag
# (`v1.2.3`), or manually via workflow_dispatch with a tag name.
#
# The `install.sh` script (scripts/install.sh, also served at brood.fly.dev/install.sh)
# downloads the tarball matching the user's OS/arch from the release these jobs create.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.1.0)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag is a claim about what the binaries contain. Nothing checked it: pushing `v0.15.0`
  # at a tree whose Cargo.toml says 0.14.1 would publish four tarballs named v0.15.0 whose
  # `brood --version` reports 0.14.1, and the mismatch would surface only for whoever
  # downloaded one. It runs before the build so a wrong tag costs seconds, not four
  # cross-compiles.
  verify:
    name: tag matches the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag, Cargo.toml and CHANGELOG must agree
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "tag=$tag  Cargo.toml=$cargo_version"

          if [ "$tag" != "v$cargo_version" ]; then
            echo "::error::tag $tag does not match Cargo.toml ($cargo_version)." \
                 "Bump the version and commit it before tagging, or tag v$cargo_version."
            exit 1
          fi

          # A release with no changelog entry is a release nobody can read. The entry is
          # cheap to write and impossible to add convincingly afterwards.
          if ! grep -q "^## $tag " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $tag' section."
            exit 1
          fi

          # The version lives in FOUR places and only two were checked. `project.blsp` is
          # brood's own manifest, so a stale one makes `nest`'s project report a version the
          # binaries do not have; `std/system.blsp`'s docstring is rendered on the hosted
          # reference page (introspected from the runtime — brood.fly.dev), and its `;; =>`
          # form is NOT the ` → ` shape `doc_examples_test` executes, so nothing catches a
          # stale one. Both were bumped by hand for v0.24.0, which is exactly the kind of
          # step that gets forgotten once.
          manifest_version="$(sed -n 's/^ *:version "\(.*\)"/\1/p' project.blsp | head -1)"
          if [ "$manifest_version" != "$cargo_version" ]; then
            echo "::error::project.blsp :version ($manifest_version) does not match" \
                 "Cargo.toml ($cargo_version)."
            exit 1
          fi

          if ! grep 'system/brood-version)' std/system.blsp | grep -q "$cargo_version"; then
            echo "::error::std/system.blsp's (system/brood-version) example does not show" \
                 "$cargo_version. It is rendered on the hosted reference page and no test" \
                 "executes it — the ' => ' form is not the doctest gate's ' -> ' form."
            exit 1
          fi
          echo "tag, Cargo.toml, project.blsp, std/system.blsp and CHANGELOG agree"

  build:
    needs: verify
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          # Intel mac: cross-compiled on the Apple-Silicon runner (macos-14). GitHub's
          # Intel macos-13 runners are scarce/deprecated; arm64 macs build x86_64-apple-
          # darwin natively (same OS SDK, `-C` via the added rustup target).
          - os: macos-14
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config git

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Restore-only, deliberately. A repository gets **10 GB** of Actions cache and GitHub
      # evicts least-recently-used entries past it; on 2026-08-27 this repo sat at 10.53 GB
      # across 18 caches, of which **~6.4 GB was this workflow** — four cross-compile targets
      # times several stale copies — against **2.7 GB** for the three CI caches that run on
      # every push. So the tag-only workflow was evicting the per-push ones, and CI kept
      # paying cold builds while appearing to be cached.
      #
      # `save-if: false` keeps the restore (a matching entry still helps) and stops this
      # workflow claiming budget. It is the right side of the trade: releases are rare and
      # already minutes of cross-compilation, while CI runs on every push and is where a cold
      # build actually costs someone waiting.
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          save-if: false

      # Lean default build (no gui/audio; jit + treesit + dev-tools) — the same set
      # `make install` ships. TARGET builds for the triple (native or cross), into
      # target/${{ matrix.target }}/release-fast/{brood,nest,brood-lsp}.
      - name: Build
        run: make release TARGET=${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          name="brood-${tag}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          bindir="target/${{ matrix.target }}/release-fast"
          cp "$bindir/brood" "$bindir/nest" "$bindir/brood-lsp" "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          ( cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256" )
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
          fail_on_unmatched_files: true
