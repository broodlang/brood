name: Release

# Build the Brood toolchain (brood + nest + brood-lsp) for each supported platform and
# attach it to a GitHub Release, with the lean runtime `nest release --target` downloads
# (ADR-714). Each file has a `.sha256` beside it. Triggered by pushing a version tag
# (`v1.2.3`), or manually via workflow_dispatch with a tag name, which builds that tag.
#
# `dry_run` builds every target from the dispatched branch and keeps the files as workflow
# artifacts instead of publishing them: how a change to this file is tested before a tag.
#
# `scripts/install.sh` (Linux, macOS) and `scripts/install.ps1` (Windows), also served at
# brood.fly.dev, download the archive matching the machine from the release these jobs create.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.1.0)"
        required: true
      dry_run:
        description: "Build from this branch and keep the files as artifacts; publish nothing"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag is a claim about what the binaries contain. Nothing checked it: pushing `v0.15.0`
  # at a tree whose Cargo.toml says 0.14.1 would publish four tarballs named v0.15.0 whose
  # `brood --version` reports 0.14.1, and the mismatch would surface only for whoever
  # downloaded one. It runs before the build so a wrong tag costs seconds, not four
  # cross-compiles.
  verify:
    name: tag matches the tree
    runs-on: ubuntu-latest
    steps:
      # A manual run for a tag builds the TAG: checking out the dispatched branch would
      # publish main's head under the tag's name. A dry run builds the branch.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && inputs.tag || '' }}
      - name: The tag, Cargo.toml and CHANGELOG must agree
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "tag=$tag  Cargo.toml=$cargo_version"

          if [ "$tag" != "v$cargo_version" ]; then
            echo "::error::tag $tag does not match Cargo.toml ($cargo_version)." \
                 "Bump the version and commit it before tagging, or tag v$cargo_version."
            exit 1
          fi

          # A release with no changelog entry is a release nobody can read. The entry is
          # cheap to write and impossible to add convincingly afterwards.
          if ! grep -q "^## $tag " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $tag' section."
            exit 1
          fi

          # The version lives in FOUR places and only two were checked. `project.blsp` is
          # brood's own manifest, so a stale one makes `nest`'s project report a version the
          # binaries do not have; `std/system.blsp`'s docstring is rendered on the hosted
          # reference page (introspected from the runtime — brood.fly.dev), and its `;; =>`
          # form is NOT the ` → ` shape `doc_examples_test` executes, so nothing catches a
          # stale one. Both were bumped by hand for v0.24.0, which is exactly the kind of
          # step that gets forgotten once.
          manifest_version="$(sed -n 's/^ *:version "\(.*\)"/\1/p' project.blsp | head -1)"
          if [ "$manifest_version" != "$cargo_version" ]; then
            echo "::error::project.blsp :version ($manifest_version) does not match" \
                 "Cargo.toml ($cargo_version)."
            exit 1
          fi

          if ! grep 'system/brood-version)' std/system.blsp | grep -q "$cargo_version"; then
            echo "::error::std/system.blsp's (system/brood-version) example does not show" \
                 "$cargo_version. It is rendered on the hosted reference page and no test" \
                 "executes it — the ' => ' form is not the doctest gate's ' -> ' form."
            exit 1
          fi
          echo "tag, Cargo.toml, project.blsp, std/system.blsp and CHANGELOG agree"

  build:
    needs: verify
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            window: gui
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            window: gui
          # A static binary for any Linux, Alpine included. Headless: a static musl binary
          # cannot load the display libraries a window opens at run time.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            window: headless
          - os: macos-15
            target: aarch64-apple-darwin
            window: gui
          # Intel mac: cross-compiled on the Apple-Silicon runner (macos-15). GitHub's
          # Intel macos-13 runners are scarce/deprecated; arm64 macs build x86_64-apple-
          # darwin natively (same OS SDK, `-C` via the added rustup target).
          - os: macos-15
            target: x86_64-apple-darwin
            window: gui
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            window: gui
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && inputs.tag || '' }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config git

      # The window's build-time headers (it loads the libraries themselves at run time).
      - name: Install the window's build dependencies (Linux)
        if: runner.os == 'Linux' && matrix.window == 'gui'
        run: scripts/ci/install-gui-deps.sh

      - name: Install the musl C toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Restore-only, deliberately: saving here evicted the per-push CI caches from the
      # repository's 10 GB Actions budget. See docs/build-and-ci.md.
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          save-if: false

      # The toolchain archive and the lean runtime, each with its .sha256, into dist/
      # (scripts/ci/release-build.sh says what each holds).
      - name: Build and package
        id: package
        shell: bash
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          scripts/ci/release-build.sh "${{ matrix.target }}" "$tag" "${{ matrix.window }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Keep the files (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      - name: Upload to release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: true
