[package]
name = "cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The Brood command-line REPL and file runner."

[[bin]]
name = "brood"
path = "src/main.rs"

[features]
# Forward the runtime's dev/tooling surface (test/observer/mcp/docs/reload/repl
# + GC debug builtins) and the tier-1 JIT (ADR-101). On by default for the dev
# `brood`; `nest release` builds the bundle-base `brood` with `--no-default-features`
# for a lean shipped runtime (ADR-038), then re-adds the JIT via `brood/jit` when
# the host supports it. `default-features = false` on the dep below makes this the
# *only* switch, so `--no-default-features` here fully strips both.
default = ["brood/dev-tools", "brood/jit", "brood/wasm"]
# Forward the brood lib's VM work-attribution counters (docs/benchmarking.md):
# `cargo run -p cli --features perf-stats`. Off by default — zero cost.
perf-stats = ["brood/perf-stats"]
# (No `jit` passthrough: the JIT is a default feature of the brood lib now, so it's
# already on via `default` above. A lean `--no-default-features` build re-adds it
# with `--features brood/jit` directly — see the Makefile's JIT_FEATURES.)

[dependencies]
brood = { path = "../lisp", default-features = false }
# Argument parsing + help text. The CLI is small enough to hand-roll, but
# we've already paid for one typo-detection bug from doing so — clap's
# typo suggestions and uniform `--foo=bar`/`--foo bar` handling pay for
# themselves. derive feature is the ergonomic path.
clap = { version = "4", features = ["derive"] }

# `PR_SET_PDEATHSIG` for the tests that run real `brood` children over loopback, so a child
# cannot outlive the test binary that spawned it (KI-29 — one was found still listening nine
# days later). Tests only, and already in the tree via the brood lib.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
